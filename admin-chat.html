<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Admin | Global Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Public Sans', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .admin-sidebar-item { border-left: 4px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; }
        .admin-sidebar-item.active { background: rgba(212, 175, 55, 0.1); color: #D4AF37; border-left: 4px solid #D4AF37; opacity: 1; }
        
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tb-table th { padding: 16px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; border-bottom: 1px solid #334155; text-align: left; }
        .tb-table td { padding: 16px; font-size: 12px; border-bottom: 1px solid #1e293b; }

        /* --- STANDARD OF 3: FLOATING DOCK STYLES --- */
        #admin-floating-dock {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 500px;
            z-index: 1000;
            display: none; /* Hidden until a chat is opened */
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #334155;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #admin-floating-dock.minimized { transform: translateY(445px); }
        .dock-header { background: #D4AF37; color: #002147; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .msg-bubble { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 12px; line-height: 1.5; }
        .msg-admin { background: #D4AF37; color: #002147; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-user { background: #1e293b; color: white; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .dock-input-area { background: #0f172a; padding: 15px; border-top: 1px solid #334155; display: flex; gap: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="h-screen flex">

    <!-- Sidebar -->
    <aside class="w-72 bg-[#111827] border-r border-slate-800 flex flex-col z-50">
        <div class="p-8 border-b border-slate-800">
            <h1 class="font-black text-white tracking-tighter text-lg leading-none">TRUST BANK</h1>
            <p class="text-[9px] font-black text-[#D4AF37] uppercase tracking-[0.3em] mt-1">Command Center</p>
        </div>
        <nav class="flex-1 p-6 space-y-2 overflow-y-auto">
            <button onclick="loadTab('dashboard')" class="admin-sidebar-item active w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-chart-pie w-5"></i> Overview</button>
            <button onclick="loadTab('users')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-users w-5"></i> Account Holders</button>
            <button onclick="loadTab('approvals')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-receipt w-5"></i> Approvals</button>
            <button onclick="loadTab('kyc')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-id-card w-5"></i> KYC Vault</button>
            <button onclick="loadTab('supportTickets')" class="admin-sidebar-item w-full flex items-center justify-between p-4 rounded-xl text-sm font-bold">
                <div class="flex items-center gap-4"><i class="fa-solid fa-comment-dots w-5"></i> Inbox</div>
                <span id="global-unread" class="hidden bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full font-black animate-pulse">0</span>
            </button>
            <button onclick="loadTab('transactions')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-clock-rotate-left w-5"></i> Audit Logs</button>
        </nav>
        <div class="p-6 border-t border-slate-800">
            <button id="logout-btn" class="w-full bg-rose-500/10 text-rose-500 p-4 rounded-xl text-[10px] font-black uppercase tracking-widest">Terminate Session</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col relative">
        <header class="h-24 bg-[#111827]/80 backdrop-blur-md border-b border-slate-800 flex justify-between items-center px-10 sticky top-0 z-40">
            <h2 id="tab-title" class="font-black uppercase tracking-[0.2em] text-sm text-white">Dashboard</h2>
            <div class="flex items-center gap-6">
                <input type="text" id="admin-search" placeholder="Search records..." class="bg-slate-900 border border-slate-700 px-6 py-2.5 text-xs rounded-2xl text-white outline-none focus:border-[#D4AF37] transition-all">
                <div class="w-10 h-10 bg-slate-800 rounded-full border border-slate-700 flex items-center justify-center text-slate-400"><i class="fa-solid fa-user-shield"></i></div>
            </div>
        </header>
        <section id="tab-content" class="p-10 overflow-y-auto flex-1"></section>
    </main>

    <!-- STANDARD OF 3: FLOATING ADMIN CHAT DOCK -->
    <div id="admin-floating-dock" class="flex flex-col">
        <div class="dock-header" onclick="toggleDock()">
            <div class="flex items-center gap-3">
                <div class="w-6 h-6 bg-[#002147] rounded flex items-center justify-center text-[#D4AF37] text-[10px] font-black" id="dock-initial">?</div>
                <span id="dock-user-name" class="font-black text-[10px] uppercase tracking-widest">Support Session</span>
            </div>
            <div class="flex items-center gap-4">
                <i class="fa-solid fa-minus text-xs"></i>
                <i class="fa-solid fa-xmark text-sm" onclick="closeDock(event)"></i>
            </div>
        </div>
        <div class="flex-1 bg-[#111827] flex flex-col overflow-hidden">
            <div id="dock-msg-flow" class="flex-1 overflow-y-auto p-5 flex flex-col gap-4 bg-slate-900/30">
                <!-- Messages populate here -->
            </div>
            <div class="dock-input-area">
                <input type="text" id="dock-reply-input" placeholder="Secure response..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-[#D4AF37]">
                <button onclick="adminSendReply()" id="dock-send-btn" class="bg-[#D4AF37] text-[#002147] w-10 h-10 rounded-xl flex items-center justify-center shadow-lg"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="kyc-modal" class="hidden fixed inset-0 bg-black/95 z-[100] flex items-center justify-center p-10 backdrop-blur-xl">
        <div class="bg-[#1e293b] w-full max-w-5xl rounded-[2.5rem] p-12 border border-slate-700 shadow-2xl relative animate-fade">
            <button onclick="closeModal('kyc-modal')" class="absolute top-8 right-8 text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-3xl"></i></button>
            <div class="mb-10"><h3 class="font-black text-2xl text-[#D4AF37]">Identity Audit</h3><p id="kyc-user-info" class="text-xs text-slate-400 uppercase tracking-widest mt-2"></p></div>
            <div class="grid grid-cols-3 gap-8">
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Front</label><img id="img-front" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Back</label><img id="img-back" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Selfie</label><img id="img-selfie" class="w-full h-64 object-cover rounded-3xl border border-slate-700"></div>
            </div>
            <div class="mt-12 flex gap-4">
                <button id="kyc-approve" class="flex-1 bg-emerald-600 p-5 rounded-2xl font-black uppercase text-xs">Verify Credentials</button>
                <button id="kyc-reject" class="flex-1 bg-rose-600 p-5 rounded-2xl font-black uppercase text-xs">Deny Submission</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, getDocs, where, addDoc, setDoc, increment, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';

        let currentTab = 'dashboard';
        let activeChatUid = null;
        let messagesUnsubscribe = null;

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            renderData();
        });

        window.loadTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.admin-sidebar-item').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
            });
            document.getElementById('tab-title').innerText = tab.toUpperCase();
            renderData();
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        const renderData = async () => {
            const container = document.getElementById('tab-content');
            container.innerHTML = `<div class="flex items-center justify-center py-40 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-4xl mr-4"></i> Accessing Records...</div>`;

            if (currentTab === 'dashboard') {
                const uSnap = await getDocs(collection(db, "users"));
                const aSnap = await getDocs(collection(db, "accounts"));
                let total = 0; aSnap.forEach(d => total += (d.data().availableBalance || 0));
                
                container.innerHTML = `
                    <div class="grid grid-cols-4 gap-6 animate-fade">
                        <div class="glass-card p-8 rounded-3xl">
                            <p class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Total Liquidity</p>
                            <h3 class="text-3xl font-black text-white">${formatCurrency(total)}</h3>
                        </div>
                        <div class="glass-card p-8 rounded-3xl">
                            <p class="text-[10px] font-black text-slate-500 uppercase mb-4 tracking-widest">Account Holders</p>
                            <h3 class="text-3xl font-black text-white">${uSnap.size}</h3>
                        </div>
                    </div>`;
            }

            if (currentTab === 'users') {
                onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), async (snap) => {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    container.innerHTML = `<div class="glass-card rounded-3xl overflow-hidden animate-fade">
                        <table class="tb-table w-full">
                            <thead><tr><th>Full Legal Name</th><th>Account ID</th><th>Balance</th><th>KYC Status</th><th class="text-right">Management</th></tr></thead>
                            <tbody>${snap.docs.map(uDoc => {
                                const u = uDoc.data(); const a = accMap[u.uid] || {};
                                return `<tr>
                                    <td><p class="font-black text-white">${u.fullName}</p><p class="text-[10px] text-slate-500 uppercase font-bold">${u.email}</p></td>
                                    <td class="font-mono text-slate-400">${a.accountNumber || '---'}</td>
                                    <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance || 0)}</td>
                                    <td><span class="px-3 py-1 rounded-full text-[9px] font-black uppercase ${u.kycStatus === 'VERIFIED' ? 'bg-emerald-500/10 text-emerald-500' : 'bg-slate-800 text-slate-400'}">${u.kycStatus || 'NONE'}</span></td>
                                    <td class="text-right flex justify-end gap-4">
                                        <button onclick="adminOpenChat('${u.uid}', '${u.fullName}')" class="text-[9px] font-black text-slate-400 uppercase hover:text-white">Message</button>
                                        <button onclick="adjustBalance('${u.uid}', '${u.fullName}')" class="text-[9px] font-black text-[#D4AF37] uppercase hover:underline">Adjust</button>
                                    </td>
                                </tr>`;
                            }).join('')}</tbody></table></div>`;
                });
            }

            if (currentTab === 'supportTickets') {
                container.innerHTML = `<div class="flex flex-col gap-4 animate-fade">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] mb-4">Support Inboxes</h3>
                    <div id="inbox-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
                </div>`;

                onSnapshot(query(collection(db, "supportTickets"), orderBy("lastTimestamp", "desc")), snap => {
                    const listCont = document.getElementById('inbox-list');
                    if (!listCont) return;
                    listCont.innerHTML = snap.docs.map(tDoc => {
                        const t = tDoc.data();
                        const isUnread = t.unreadAdminCount > 0;
                        return `<div onclick="adminOpenChat('${tDoc.id}', '${t.userName}')" class="glass-card p-6 rounded-[2rem] cursor-pointer hover:bg-slate-800 transition-all border border-transparent ${isUnread ? 'border-[#D4AF37]/50' : ''}">
                            <div class="flex justify-between items-start mb-4">
                                <div class="w-10 h-10 bg-slate-800 rounded-xl flex items-center justify-center text-[#D4AF37] font-black">${t.userName.charAt(0)}</div>
                                ${isUnread ? `<span class="bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full font-black">UNREAD</span>` : ''}
                            </div>
                            <p class="font-black text-white mb-1">${t.userName}</p>
                            <p class="text-[10px] text-slate-500 font-bold truncate">${t.lastMessage || 'Open Session'}</p>
                        </div>`;
                    }).join('');
                });
            }
        };

        // --- STANDARD OF 3: PERSISTENT DOCK LOGIC ---
        window.adminOpenChat = (uid, name) => {
            if (messagesUnsubscribe) messagesUnsubscribe(); // Clean up previous
            activeChatUid = uid;

            const dock = document.getElementById('admin-floating-dock');
            dock.style.display = 'flex';
            dock.classList.remove('minimized');
            
            document.getElementById('dock-user-name').innerText = name;
            document.getElementById('dock-initial').innerText = name.charAt(0);

            // Mark as read for Admin
            updateDoc(doc(db, "supportTickets", uid), { unreadAdminCount: 0 }).catch(() => {});

            // Start Message Listener
            const q = query(collection(db, "supportTickets", uid, "messages"), orderBy("timestamp", "asc"));
            messagesUnsubscribe = onSnapshot(q, (snap) => {
                const flow = document.getElementById('dock-msg-flow');
                flow.innerHTML = snap.docs.map(d => {
                    const m = d.data(); const isAdmin = m.senderRole === 'admin';
                    return `<div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'}">
                        <div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-user'}">${m.text}</div>
                        <span class="text-[8px] font-bold text-slate-600 uppercase mt-2 px-2">${isAdmin ? 'Admin' : 'Client'} • ${m.timestamp ? formatDate(m.timestamp) : '...'}</span>
                    </div>`;
                }).join('');
                flow.scrollTop = flow.scrollHeight;
            });

            // Input Event
            document.getElementById('dock-reply-input').onkeypress = (e) => {
                if(e.key === 'Enter') adminSendReply();
            };
        };

        window.adminSendReply = async () => {
            const input = document.getElementById('dock-reply-input');
            const btn = document.getElementById('dock-send-btn');
            const text = input.value.trim();
            if (!text || !activeChatUid || btn.disabled) return;
            
            btn.disabled = true;
            input.value = "";
            try {
                await addDoc(collection(db, "supportTickets", activeChatUid, "messages"), { 
                    text, senderRole: 'admin', timestamp: serverTimestamp() 
                });
                await updateDoc(doc(db, "supportTickets", activeChatUid), { 
                    lastMessage: text, lastTimestamp: serverTimestamp(), unreadUserCount: increment(1) 
                });
            } catch (err) { console.error(err); }
            finally { btn.disabled = false; }
        };

        window.toggleDock = () => document.getElementById('admin-floating-dock').classList.toggle('minimized');
        window.closeDock = (e) => {
            e.stopPropagation();
            if(messagesUnsubscribe) messagesUnsubscribe();
            document.getElementById('admin-floating-dock').style.display = 'none';
            activeChatUid = null;
        };

        window.adjustBalance = async (uid, name) => {
            const amt = prompt(`Adjust Balance for ${name}:\n(Positive for credit, Negative for debit)`);
            if (!amt || isNaN(amt)) return;
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
            if (accQ.empty) return;
            const accRef = doc(db, "accounts", accQ.docs[0].id);
            await updateDoc(accRef, { availableBalance: increment(parseFloat(amt)), totalBalance: increment(parseFloat(amt)) });
        };

        // Sidebar Unread Badge
        onSnapshot(collection(db, "supportTickets"), snap => {
            let total = 0;
            snap.docs.forEach(d => total += (d.data().unreadAdminCount || 0));
            const badge = document.getElementById('global-unread');
            if(badge) {
                if(total > 0) { badge.innerText = total; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            }
        });

        document.getElementById('logout-btn').onclick = () => auth.signOut();
        loadTab('dashboard');
    </script>
</body>
</html>
