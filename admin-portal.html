<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trust Admin | Global Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Public Sans', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .admin-sidebar-item { border-left: 4px solid transparent; transition: all 0.3s; opacity: 0.6; cursor: pointer; }
        .admin-sidebar-item.active { background: rgba(212, 175, 55, 0.1); color: #D4AF37; border-left: 4px solid #D4AF37; opacity: 1; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .tb-table th { padding: 16px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #64748b; border-bottom: 1px solid #334155; text-align: left; }
        .tb-table td { padding: 16px; font-size: 12px; border-bottom: 1px solid #1e293b; }
        
        /* Floating Dock Styles - OPTION 3 */
        #floating-chat-dock { position: fixed; bottom: 20px; right: 20px; width: 380px; height: 500px; z-index: 200; transition: transform 0.3s ease; display: none; }
        #floating-chat-dock.minimized { transform: translateY(445px); }
        .dock-header { background: #D4AF37; color: #002147; cursor: pointer; }
        .dock-content { background: #111827; border: 1px solid #334155; border-top: none; }
        .msg-bubble { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 12px; line-height: 1.4; }
        .msg-admin { background: #D4AF37; color: #002147; align-self: flex-end; }
        .msg-user { background: #334155; color: white; align-self: flex-start; }
    </style>
</head>
<body class="h-screen flex">

    <aside class="w-72 bg-[#111827] border-r border-slate-800 flex flex-col z-50">
        <div class="p-8 border-b border-slate-800">
            <h1 class="font-black text-white tracking-tighter text-lg">TRUST BANK</h1>
            <p class="text-[9px] font-black text-[#D4AF37] uppercase tracking-[0.3em]">Command Center</p>
        </div>
        <nav class="flex-1 p-6 space-y-2 overflow-y-auto">
            <button onclick="loadTab('dashboard')" class="admin-sidebar-item active w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-chart-pie w-5"></i> Overview</button>
            <button onclick="loadTab('users')" class="admin-sidebar-item w-full flex items-center gap-4 p-4 rounded-xl text-sm font-bold"><i class="fa-solid fa-users w-5"></i> Users</button>
            <button onclick="loadTab('supportTickets')" class="admin-sidebar-item w-full flex items-center justify-between p-4 rounded-xl text-sm font-bold">
                <div class="flex items-center gap-4"><i class="fa-solid fa-comment-dots w-5"></i> Support</div>
                <span id="global-unread" class="hidden bg-rose-600 text-white text-[10px] px-2 py-0.5 rounded-full font-black">0</span>
            </button>
        </nav>
        <div class="p-6">
            <button id="logout-btn" class="w-full bg-rose-500/10 text-rose-500 p-4 rounded-xl text-[10px] font-black uppercase">Term. Session</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="h-24 border-b border-slate-800 flex justify-between items-center px-10">
            <h2 id="tab-title" class="font-black uppercase tracking-[0.2em] text-sm text-white">Dashboard</h2>
        </header>
        <section id="tab-content" class="p-10 overflow-y-auto flex-1"></section>
    </main>

    <!-- Floating Chat Dock - Persistent UI -->
    <div id="floating-chat-dock" class="shadow-2xl rounded-t-2xl overflow-hidden flex flex-col">
        <div class="dock-header p-4 flex justify-between items-center font-black uppercase text-[10px] tracking-widest" onclick="toggleDock()">
            <div class="flex items-center gap-2"><i class="fa-solid fa-comment-dots"></i><span id="dock-user-name">Chat Session</span></div>
            <div class="flex gap-3"><i class="fa-solid fa-minus"></i><i class="fa-solid fa-xmark" onclick="closeDock(event)"></i></div>
        </div>
        <div class="dock-content flex-1 flex flex-col">
            <div id="dock-msg-flow" class="flex-1 p-5 overflow-y-auto flex flex-col gap-3"></div>
            <div class="p-4 border-t border-slate-800 flex gap-2">
                <input type="text" id="dock-input" placeholder="Type reply..." class="flex-1 bg-slate-800 border border-slate-700 rounded-xl px-4 py-2 text-xs text-white outline-none">
                <button id="dock-send-btn" class="text-[#D4AF37]"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, getDocs, addDoc, orderBy, serverTimestamp, increment, where } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';

        let currentTab = 'dashboard';
        let dockUnsubscribe = null;

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            renderData();
        });

        window.loadTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.admin-sidebar-item').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
            });
            document.getElementById('tab-title').innerText = tab.toUpperCase();
            renderData();
        };

        const renderData = async () => {
            const container = document.getElementById('tab-content');
            
            if (currentTab === 'dashboard') {
                container.innerHTML = `<div class="glass-card p-10 rounded-3xl"><h3>Welcome to Command Center</h3></div>`;
            }

            if (currentTab === 'users') {
                onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), async (snap) => {
                    container.innerHTML = `<div class="glass-card rounded-3xl overflow-hidden"><table class="tb-table w-full">
                        <thead><tr><th>Name</th><th>Email</th><th>KYC</th><th class="text-right">Action</th></tr></thead>
                        <tbody>${snap.docs.map(d => {
                            const u = d.data();
                            return `<tr><td>${u.fullName}</td><td>${u.email}</td><td>${u.kycStatus || 'NONE'}</td>
                            <td class="text-right"><button onclick="adminOpenChat('${u.uid}', '${u.fullName}')" class="text-[#D4AF37] font-black text-[10px] uppercase">Message</button></td></tr>`;
                        }).join('')}</tbody></table></div>`;
                });
            }

            if (currentTab === 'supportTickets') {
                onSnapshot(query(collection(db, "supportTickets"), orderBy("lastTimestamp", "desc")), snap => {
                    container.innerHTML = `<div class="grid grid-cols-1 gap-4">${snap.docs.map(tDoc => {
                        const t = tDoc.data();
                        return `<div onclick="adminOpenChat('${tDoc.id}', '${t.userName}')" class="glass-card p-6 rounded-2xl cursor-pointer flex justify-between items-center">
                            <div><p class="font-black">${t.userName}</p><p class="text-[10px] text-slate-500">${t.lastMessage}</p></div>
                            ${t.unreadAdminCount > 0 ? `<span class="bg-rose-600 px-2 py-0.5 rounded-full text-[10px]">${t.unreadAdminCount}</span>` : ''}
                        </div>`;
                    }).join('')}</div>`;
                });
            }
        };

        // DOCK LOGIC - OPTION 3
        window.adminOpenChat = (uid, name) => {
            if (dockUnsubscribe) dockUnsubscribe();
            const dock = document.getElementById('floating-chat-dock');
            dock.style.display = 'flex';
            dock.classList.remove('minimized');
            document.getElementById('dock-user-name').innerText = name;

            updateDoc(doc(db, "supportTickets", uid), { unreadAdminCount: 0 }).catch(() => {});

            const q = query(collection(db, "supportTickets", uid, "messages"), orderBy("timestamp", "asc"));
            dockUnsubscribe = onSnapshot(q, (snap) => {
                const flow = document.getElementById('dock-msg-flow');
                flow.innerHTML = snap.docs.map(d => {
                    const m = d.data(); const isAdmin = m.senderRole === 'admin';
                    return `<div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'}"><div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-user'}">${m.text}</div></div>`;
                }).join('');
                flow.scrollTop = flow.scrollHeight;
            });

            document.getElementById('dock-send-btn').onclick = () => sendReply(uid);
            document.getElementById('dock-input').onkeypress = (e) => { if(e.key === 'Enter') sendReply(uid); };
        };

        async function sendReply(uid) {
            const input = document.getElementById('dock-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = "";
            await addDoc(collection(db, "supportTickets", uid, "messages"), { text, senderRole: 'admin', timestamp: serverTimestamp() });
            await updateDoc(doc(db, "supportTickets", uid), { lastMessage: text, lastTimestamp: serverTimestamp(), unreadUserCount: increment(1) });
        }

        window.toggleDock = () => document.getElementById('floating-chat-dock').classList.toggle('minimized');
        window.closeDock = (e) => { e.stopPropagation(); if(dockUnsubscribe) dockUnsubscribe(); document.getElementById('floating-chat-dock').style.display = 'none'; };
        document.getElementById('logout-btn').onclick = () => auth.signOut();

        onSnapshot(collection(db, "supportTickets"), snap => {
            let total = 0; snap.docs.forEach(d => total += (d.data().unreadAdminCount || 0));
            const b = document.getElementById('global-unread');
            if(total > 0) { b.innerText = total; b.classList.remove('hidden'); } else b.classList.add('hidden');
        });
    </script>
</body>
</html>
