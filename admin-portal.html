<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-btn.active { background: #334155; color: white; border-color: #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; text-align: left; border-bottom: 2px solid #334155; }
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        #chat-body::-webkit-scrollbar { width: 4px; }
        #chat-body::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .kyc-img-preview { max-width: 100%; border-radius: 15px; border: 1px solid #334155; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <nav class="bg-[#1e293b] p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="font-black uppercase tracking-widest text-sm text-[#D4AF37]">Central Control</h1>
        <div class="flex items-center gap-6">
            <div id="msg-notify-dot" class="hidden w-3 h-3 bg-rose-500 rounded-full animate-bounce"></div>
            <span id="admin-email" class="text-[10px] font-bold text-slate-400 uppercase">---</span>
            <button id="logout-btn" class="bg-rose-500/10 text-rose-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Exit</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
            <button class="tab-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="users">Users</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="deposits">Deposits</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="withdrawals">Withdrawals</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="transfers">Transfers</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="kyc">KYC Vault</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="supportTickets">Live Chat</button>
        </div>

        <div id="tab-content" class="bg-[#1e293b]/30 rounded-[2rem] border border-slate-800 p-8"></div>
    </div>

    <!-- KYC Preview Modal -->
    <div id="kyc-modal" class="hidden fixed inset-0 bg-black/90 z-[300] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-2xl rounded-[2.5rem] p-8 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-black uppercase text-sm">KYC Document Preview</h3>
                <button onclick="document.getElementById('kyc-modal').classList.add('hidden')" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="kyc-details" class="mb-6 grid grid-cols-2 gap-4 text-[10px] uppercase font-bold text-slate-400">
                <p>Type: <span id="kyc-type-text" class="text-white"></span></p>
                <p>UID: <span id="kyc-uid-text" class="text-white"></span></p>
            </div>
            <img id="kyc-large-img" class="kyc-img-preview mx-auto shadow-2xl" src="">
            <div class="mt-8 flex gap-4">
                <button id="kyc-approve-btn" class="flex-1 bg-emerald-600 p-4 rounded-xl font-black uppercase text-[10px]">Verify Identity</button>
                <button id="kyc-decline-btn" class="flex-1 bg-rose-600 p-4 rounded-xl font-black uppercase text-[10px]">Reject Document</button>
            </div>
        </div>
    </div>

    <!-- Live Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-[2.5rem] p-8 border border-slate-700 h-[650px] flex flex-col shadow-2xl">
            <div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-4">
                <h3 id="chat-subject" class="font-black uppercase text-sm">Thread</h3>
                <button onclick="closeAdminChat()" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-body" class="flex-1 overflow-y-auto space-y-4 mb-6 pr-2"></div>
            <div class="flex gap-2 bg-slate-900 p-2 rounded-2xl">
                <input type="text" id="admin-reply" class="flex-1 bg-transparent border-none text-sm px-4" placeholder="Reply...">
                <button id="send-reply-btn" class="bg-[#D4AF37] text-navy-900 px-6 py-3 rounded-xl font-black uppercase text-[10px]">Send</button>
            </div>
        </div>
    </div>

    <!-- Notification Audio -->
    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, runTransaction, serverTimestamp, getDocs, where, addDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency } from './utils.js';
        import { showToast } from './toast.js';

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            document.getElementById('admin-email').innerText = user.email;
            initGlobalChatListener();
        });

        // 1. GLOBAL CHAT NOTIFICATIONS
        function initGlobalChatListener() {
            let initialLoad = true;
            onSnapshot(collection(db, "supportTickets"), (snap) => {
                if (initialLoad) { initialLoad = false; return; }
                
                snap.docChanges().forEach(change => {
                    const data = change.doc.data();
                    const lastMsg = data.messages[data.messages.length - 1];
                    
                    if (change.type === "modified" && lastMsg.sender === "user") {
                        showToast(`New Message: ${data.subject}`);
                        document.getElementById('msg-notify-dot').classList.remove('hidden');
                        document.getElementById('ping-sound').play();
                    }
                });
            });
        }

        const loadTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            const content = document.getElementById('tab-content');
            
            onSnapshot(collection(db, tab), async (snap) => {
                if (tab === 'kyc') {
                    content.innerHTML = `<table class="tb-table w-full">
                        <thead><tr><th>User UID</th><th>Doc Type</th><th>Status</th><th>View</th></tr></thead>
                        <tbody>${snap.docs.map(dDoc => {
                            const d = dDoc.data();
                            return `<tr>
                                <td class="font-mono text-slate-500">${d.uid.slice(0,10)}...</td>
                                <td class="font-bold">${d.documentType}</td>
                                <td>${d.status}</td>
                                <td><button onclick="viewKYC('${dDoc.id}')" class="bg-[#D4AF37] text-navy-900 px-3 py-1 rounded font-black text-[9px] uppercase">View File</button></td>
                            </tr>`;
                        }).join('')}</tbody></table>`;
                } else if (tab === 'supportTickets') {
                    document.getElementById('msg-notify-dot').classList.add('hidden');
                    content.innerHTML = `<table class="tb-table w-full">
                        <thead><tr><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(tDoc => {
                            const t = tDoc.data();
                            return `<tr><td>${t.subject}</td><td>${t.status}</td><td><button onclick="openAdminChat('${tDoc.id}')" class="text-blue-400 font-bold uppercase text-[9px]">Chat</button></td></tr>`;
                        }).join('')}</tbody></table>`;
                } else if (tab === 'users') {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    content.innerHTML = `<table class="tb-table w-full"><thead><tr><th>User</th><th>Balance</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(uDoc => {
                            const u = uDoc.data();
                            const a = accMap[u.uid] || {};
                            return `<tr><td>${u.fullName}<br><span class="text-[9px] text-slate-500 font-bold uppercase">${u.email}</span></td>
                            <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance)}</td>
                            <td><button onclick="manageUser('${u.uid}', '${u.fullName}')" class="bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg font-black uppercase text-[9px]">Adjust Balance</button></td></tr>`;
                        }).join('')}</tbody></table>`;
                } else {
                    content.innerHTML = `<table class="tb-table w-full"><thead><tr><th>ID</th><th>Value</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(dDoc => {
                            const d = dDoc.data();
                            return `<tr><td>${dDoc.id.slice(0,6)}</td><td class="font-black">${formatCurrency(d.amount)}</td><td>${d.status}</td>
                            <td>${d.status === 'PENDING' ? `<button onclick="approveRequest('${tab}', '${dDoc.id}')" class="text-emerald-400 mr-3">Approve</button><button onclick="declinePrompt('${tab}', '${dDoc.id}')" class="text-rose-400">Decline</button>` : 'Processed'}</td></tr>`;
                        }).join('')}</tbody></table>`;
                }
            });
        };

        // 2. KYC VIEW LOGIC
        window.viewKYC = async (id) => {
            const snap = await getDocs(query(collection(db, "kyc"), where("__name__", "==", id)));
            const data = snap.docs[0].data();
            
            document.getElementById('kyc-large-img').src = data.documentImage;
            document.getElementById('kyc-type-text').innerText = data.documentType;
            document.getElementById('kyc-uid-text').innerText = data.uid;
            document.getElementById('kyc-modal').classList.remove('hidden');

            document.getElementById('kyc-approve-btn').onclick = () => {
                approveRequest('kyc', id);
                document.getElementById('kyc-modal').classList.add('hidden');
            };
            document.getElementById('kyc-decline-btn').onclick = () => {
                declinePrompt('kyc', id);
                document.getElementById('kyc-modal').classList.add('hidden');
            };
        };

        let chatUnsubscribe = null;
        window.openAdminChat = (id) => {
            const modal = document.getElementById('chat-modal');
            const body = document.getElementById('chat-body');
            modal.classList.remove('hidden');
            chatUnsubscribe = onSnapshot(doc(db, "supportTickets", id), (snap) => {
                const data = snap.data();
                if (!data) return;
                document.getElementById('chat-subject').innerText = data.subject;
                body.innerHTML = data.messages.map(m => `
                    <div class="flex ${m.sender === 'user' ? 'justify-start' : 'justify-end'}">
                        <div class="max-w-[85%] p-4 rounded-2xl ${m.sender === 'user' ? 'bg-slate-800 text-slate-200' : 'bg-blue-600 text-white shadow-lg'}">
                            <p class="text-xs font-bold">${m.text}</p>
                        </div>
                    </div>`).join('');
                body.scrollTop = body.scrollHeight;
            });
            document.getElementById('send-reply-btn').onclick = async () => {
                const text = document.getElementById('admin-reply').value;
                if (!text) return;
                await updateDoc(doc(db, "supportTickets", id), {
                    messages: arrayUnion({ sender: "admin", text, timestamp: new Date().toISOString() }),
                    status: "OPEN"
                });
                document.getElementById('admin-reply').value = "";
            };
        };

        window.closeAdminChat = () => { if (chatUnsubscribe) chatUnsubscribe(); document.getElementById('chat-modal').classList.add('hidden'); };

        window.approveRequest = async (type, id) => {
            try {
                await runTransaction(db, async (transaction) => {
                    const reqRef = doc(db, type, id);
                    const reqSnap = await transaction.get(reqRef);
                    const req = reqSnap.data();

                    if (type === 'kyc') {
                        transaction.update(doc(db, "users", req.uid), { kycStatus: 'VERIFIED' });
                    } else {
                        const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", req.uid)));
                        const accRef = doc(db, "accounts", accQ.docs[0].id);
                        const acc = accQ.docs[0].data();
                        const amount = type === 'deposits' ? req.amount : -req.amount;
                        transaction.update(accRef, { availableBalance: acc.availableBalance + amount });
                        transaction.set(doc(collection(db, "transactions")), { uid: req.uid, amount: req.amount, type: type.toUpperCase(), direction: amount > 0 ? 'credit' : 'debit', description: `Approved ${type}`, status: "SUCCESSFUL", timestamp: serverTimestamp() });
                    }
                    transaction.update(reqRef, { status: 'APPROVED' });
                });
                showToast("Request Approved");
            } catch(e) { console.error(e); }
        };

        window.declinePrompt = async (type, id) => {
            const reason = prompt("Decline Reason:");
            if(!reason) return;
            await updateDoc(doc(db, type, id), { status: 'DECLINED', declineReason: reason });
            if(type === 'kyc') {
                const kSnap = await getDocs(query(collection(db, "kyc"), where("__name__", "==", id)));
                await updateDoc(doc(db, "users", kSnap.docs[0].data().uid), { kycStatus: 'REJECTED' });
            }
            showToast("Request Declined");
        };

        window.manageUser = async (uid, name) => {
            const amt = prompt(`Adjust Balance for ${name}:`);
            if(!amt || isNaN(amt)) return;
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
            await updateDoc(doc(db, "accounts", accQ.docs[0].id), { availableBalance: increment(parseFloat(amt)) });
            await addDoc(collection(db, "transactions"), { uid, amount: Math.abs(amt), direction: amt > 0 ? 'credit' : 'debit', type: 'ADMIN', description: 'Admin Adjustment', status: 'SUCCESSFUL', timestamp: serverTimestamp() });
            showToast("Balance Adjusted");
        };

        document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => loadTab(b.dataset.tab));
        loadTab('users');
    </script>
</body>
</html>
