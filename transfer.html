<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transfer | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 pb-32">
    <div id="header-container"></div>
    <main class="max-w-md mx-auto px-6 pt-8">
        <div id="status-banner-container"></div>

        <form id="transfer-form" class="space-y-6">
            <div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-xl">
                <div class="mb-8">
                    <label>Recipient Account ID</label>
                    <input type="text" id="target-acc" class="w-full" placeholder="10-digit ID" maxlength="10" required>
                </div>
                <div class="mb-8">
                    <label>Amount</label>
                    <input type="number" id="amount" class="w-full" placeholder="0.00" step="0.01" required>
                </div>
                <div class="mb-2">
                    <label>Description</label>
                    <input type="text" id="description" class="w-full" placeholder="e.g. Monthly Rent">
                </div>
            </div>
            <button type="submit" id="submit-btn" class="w-full btn-primary h-16">Send Transfer</button>
        </form>

        <div id="success-view" class="hidden"></div>
    </main>
    <div id="nav-container"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, addDoc, serverTimestamp, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { renderHeader, renderBottomNav, renderDeclinedBanner, renderApprovedSuccess } from './components.js';
        import { formatCurrency } from './utils.js';
        import { withPin } from './pin-guard.js';

        document.getElementById('header-container').innerHTML = renderHeader('Money Transfer', true);
        document.getElementById('nav-container').innerHTML = renderBottomNav('dashboard');

        const form = document.getElementById('transfer-form');
        const bannerCont = document.getElementById('status-banner-container');
        const successCont = document.getElementById('success-view');

        auth.onAuthStateChanged(user => {
            if (user) {
                const q = query(collection(db, "transfers"), where("uid", "==", user.uid), orderBy("createdAt", "desc"), limit(1));
                onSnapshot(q, (snap) => {
                    if (snap.empty) return;
                    const d = snap.docs[0].data();
                    bannerCont.innerHTML = "";
                    form.classList.remove('hidden');
                    successCont.classList.add('hidden');
                    
                    if (d.status === "PENDING") {
                        form.querySelectorAll('input, button').forEach(el => el.disabled = true);
                        document.getElementById('submit-btn').innerText = "Transfer Pending Review...";
                    } else if (d.status === "DECLINED") {
                        bannerCont.innerHTML = renderDeclinedBanner(d.declineReason);
                        form.querySelectorAll('input, button').forEach(el => el.disabled = false);
                    } else if (d.status === "APPROVED") {
                        form.classList.add('hidden');
                        successCont.classList.remove('hidden');
                        successCont.innerHTML = renderApprovedSuccess(`Transfer of ${formatCurrency(d.amount)} sent.`, () => location.reload());
                    }
                });
            }
        });

        form.onsubmit = (e) => {
            e.preventDefault();
            withPin(async () => {
                const btn = document.getElementById('submit-btn');
                btn.disabled = true;
                await addDoc(collection(db, "transfers"), {
                    uid: auth.currentUser.uid,
                    recipientAcc: document.getElementById('target-acc').value,
                    amount: parseFloat(document.getElementById('amount').value),
                    description: document.getElementById('description').value || "No description",
                    status: "PENDING",
                    createdAt: serverTimestamp()
                });
            });
        };
    </script>
</body>
</html>
