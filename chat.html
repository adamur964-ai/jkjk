--- FILE: chat.html ---
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Concierge | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        
        body { 
            font-family: 'Public Sans', sans-serif; 
            background-color: #f8fafc; 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            overflow: hidden;
        }

        /* Message Bubble Styles */
        .msg-bubble { 
            max-width: 80%; 
            padding: 14px 18px; 
            font-size: 14px; 
            line-height: 1.5; 
            position: relative;
            animation: slideUp 0.3s ease-out forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user { 
            background: #002147; 
            color: white; 
            align-self: flex-end; 
            border-radius: 20px 20px 4px 20px; 
            box-shadow: 0 4px 15px rgba(0, 33, 71, 0.15);
        }

        .msg-admin { 
            background: white; 
            color: #1e293b; 
            align-self: flex-start; 
            border-radius: 20px 20px 20px 4px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        /* Custom Scrollbar */
        #chat-flow::-webkit-scrollbar { width: 4px; }
        #chat-flow::-webkit-scrollbar-track { background: transparent; }
        #chat-flow::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }

        /* Typing Animation */
        .typing-dot { width: 6px; height: 6px; background: #94a3b8; border-radius: 50%; animation: pulse 1.5s infinite; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        .date-divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .date-divider::before, .date-divider::after { content: ''; flex: 1; border-bottom: 1px solid #e2e8f0; }
        .date-divider:not(:empty)::before { margin-right: .25em; }
        .date-divider:not(:empty)::after { margin-left: .25em; }
    </style>
</head>
<body>

    <!-- Header: Concierge Profile -->
    <header class="bg-white border-b border-slate-200 p-5 flex items-center justify-between sticky top-0 z-50 shadow-sm">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-slate-50 text-slate-400 hover:bg-slate-100 transition-all">
                <i class="fa-solid fa-chevron-left"></i>
            </a>
            <div class="relative">
                <img src="https://ui-avatars.com/api/?name=Trust+Support&background=002147&color=D4AF37&bold=true" class="w-11 h-11 rounded-full border-2 border-slate-50">
                <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-white rounded-full"></div>
            </div>
            <div>
                <h2 class="text-sm font-black text-[#002147] leading-none">Support Concierge</h2>
                <div class="flex items-center gap-1.5 mt-1.5">
                    <span class="text-[9px] font-black text-emerald-500 uppercase tracking-widest">Always Online</span>
                    <span class="text-slate-300">•</span>
                    <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Encrypted</span>
                </div>
            </div>
        </div>
        <button class="text-slate-300 hover:text-[#002147]"><i class="fa-solid fa-ellipsis-vertical"></i></button>
    </header>

    <!-- Chat Stream -->
    <main id="chat-flow" class="flex-1 overflow-y-auto p-6 flex flex-col gap-4 bg-[#f8fafc]">
        <!-- Messages will be injected here -->
    </main>

    <!-- Real-time Typing Indicator -->
    <div id="typing-ui" class="hidden px-8 py-3 flex gap-1.5 items-center bg-[#f8fafc]">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
        <span class="text-[10px] font-bold text-slate-400 uppercase ml-2">Concierge is responding</span>
    </div>

    <!-- Smart Input Bar -->
    <div class="p-5 bg-white border-t border-slate-200">
        <div class="max-w-2xl mx-auto flex items-center gap-3 bg-slate-50 p-2.5 rounded-[1.5rem] border border-slate-200 focus-within:border-[#002147] transition-all">
            <button class="w-10 h-10 text-slate-400 hover:text-[#002147] transition-colors">
                <i class="fa-solid fa-paperclip text-lg"></i>
            </button>
            <input type="text" id="chat-input" placeholder="How can we help you today?" 
                   class="flex-1 bg-transparent border-none focus:ring-0 text-sm font-bold text-[#002147] px-2">
            <button id="send-btn" class="w-11 h-11 bg-[#002147] text-[#D4AF37] rounded-[1.2rem] flex items-center justify-center shadow-lg shadow-navy-900/20 active:scale-90 transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { collection, doc, onSnapshot, addDoc, updateDoc, serverTimestamp, query, orderBy, setDoc, increment, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";

        let userUid = null;
        let userName = "";

        // Check Auth and Initialize
        auth.onAuthStateChanged(user => {
            if (!user) return window.location.href = 'login.html';
            userUid = user.uid;
            userName = user.displayName || "Trust Client";
            
            // Fetch user profile name if display name is null
            getDoc(doc(db, "users", userUid)).then(snap => {
                if(snap.exists()) userName = snap.data().fullName;
                initChatSync();
            });
        });

        function initChatSync() {
            const flow = document.getElementById('chat-flow');
            
            // 1. Listen for Live Messages in Sub-collection
            const q = query(collection(db, "supportTickets", userUid, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, snap => {
                flow.innerHTML = "";
                let lastDate = "";

                snap.docs.forEach(docSnap => {
                    const m = docSnap.data();
                    const isMe = m.senderRole === 'user';
                    const msgDate = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleDateString() : 'Today';

                    // Group by Date
                    if (msgDate !== lastDate) {
                        flow.innerHTML += `<div class="date-divider">${msgDate === new Date().toLocaleDateString() ? 'Today' : msgDate}</div>`;
                        lastDate = msgDate;
                    }

                    const time = m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...';

                    flow.innerHTML += `
                        <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} mb-1">
                            <div class="msg-bubble ${isMe ? 'msg-user' : 'msg-admin'}">
                                ${m.text}
                                <div class="flex items-center gap-1.5 mt-2 opacity-50 text-[8px] font-bold ${isMe ? 'justify-end' : ''}">
                                    ${time}
                                    ${isMe ? '<i class="fa-solid fa-check-double text-blue-300"></i>' : ''}
                                </div>
                            </div>
                        </div>`;
                });
                flow.scrollTop = flow.scrollHeight;

                // Clear user's unread notifications when they view the chat
                updateDoc(doc(db, "supportTickets", userUid), { unreadUserCount: 0 });
            });

            // 2. Listen for Admin Typing Status
            onSnapshot(doc(db, "supportTickets", userUid), snap => {
                const data = snap.data();
                const typingUI = document.getElementById('typing-ui');
                if (data?.isTypingAdmin) {
                    typingUI.classList.remove('hidden');
                    flow.scrollTop = flow.scrollHeight;
                } else {
                    typingUI.classList.add('hidden');
                }
            });
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            // Update parent ticket metadata for the Admin CRM View
            await setDoc(doc(db, "supportTickets", userUid), {
                uid: userUid,
                userName: userName,
                lastMessage: text,
                lastTimestamp: serverTimestamp(),
                unreadAdminCount: increment(1),
                isTypingUser: false,
                status: 'OPEN'
            }, { merge: true });

            // Add the actual message to the sub-collection
            await addDoc(collection(db, "supportTickets", userUid, "messages"), {
                text,
                senderRole: 'user',
                timestamp: serverTimestamp()
            });
        }

        // Typing Status Logic
        let typingTimeout;
        document.getElementById('chat-input').addEventListener('input', () => {
            updateDoc(doc(db, "supportTickets", userUid), { isTypingUser: true });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                updateDoc(doc(db, "supportTickets", userUid), { isTypingUser: false });
            }, 3000);
        });

        document.getElementById('send-btn').onclick = sendMessage;
        document.getElementById('chat-input').onkeypress = (e) => e.key === 'Enter' && sendMessage();
    </script>
</body>
</html>
