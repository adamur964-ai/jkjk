<!-- Inside kyc-form in kyc.html -->
<div class="bg-white p-8 rounded-[2.5rem] border border-slate-200 space-y-6">
    <div>
        <label>Document Type</label>
        <select id="doc-type" class="w-full"><option>Passport</option><option>ID Card</option></select>
    </div>
    <div>
        <label>Front Image</label>
        <input type="file" id="kyc-front" class="w-full" accept="image/*" required>
    </div>
    <div>
        <label>Back Image</label>
        <input type="file" id="kyc-back" class="w-full" accept="image/*" required>
    </div>
    <div>
        <label>Selfie Image</label>
        <input type="file" id="kyc-selfie" class="w-full" accept="image/*" required>
    </div>
</div>
<button type="submit" id="submit-btn" class="w-full btn-primary h-16 mt-6">Submit for Verification</button>

<script type="module">
    // Inside form.onsubmit logic:
    const front = await compressImage(document.getElementById('kyc-front').files[0]);
    const back = await compressImage(document.getElementById('kyc-back').files[0]);
    const selfie = await compressImage(document.getElementById('kyc-selfie').files[0]);

    await setDoc(doc(db, "kyc", auth.currentUser.uid), {
        uid: auth.currentUser.uid,
        documentType: document.getElementById('doc-type').value,
        documentFront: front,
        documentBack: back,
        documentSelfie: selfie,
        status: "PENDING",
        submittedAt: serverTimestamp()
    });
</script>
