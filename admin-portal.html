<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-sidebar-item.active { background: #334155; color: #D4AF37; border-left: 4px solid #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; border-bottom: 2px solid #334155; }
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        #chat-flow { height: 450px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .kyc-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 1px solid #334155; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col">
        <div class="p-6 border-b border-slate-800">
            <h1 class="font-black text-[#D4AF37] tracking-tighter text-xl">TRUST ADMIN</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="loadTab('users')" class="admin-sidebar-item active w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold transition-all"><i class="fa-solid fa-users"></i> Users List</button>
            <button onclick="loadTab('kyc')" class="admin-sidebar-item w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold transition-all"><i class="fa-solid fa-id-card"></i> KYC Vault</button>
            <button onclick="loadTab('supportTickets')" class="admin-sidebar-item w-full flex items-center justify-between p-3 rounded-lg text-sm font-bold transition-all">
                <span><i class="fa-solid fa-headset mr-3"></i> Support</span>
                <span id="unread-count" class="hidden bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="loadTab('transactions')" class="admin-sidebar-item w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold transition-all"><i class="fa-solid fa-receipt"></i> Audit Logs</button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full bg-rose-500/10 text-rose-500 p-3 rounded-lg text-xs font-black uppercase">Sign Out</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
        <header class="p-6 bg-[#1e293b]/50 border-b border-slate-800 flex justify-between items-center">
            <h2 id="tab-title" class="font-black uppercase tracking-widest text-sm">Users List</h2>
            <div class="relative w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="admin-search" placeholder="Search data..." class="w-full bg-slate-900 border-slate-700 pl-10 text-xs rounded-xl h-10">
            </div>
        </header>

        <section id="tab-content" class="p-8 overflow-y-auto"></section>
    </main>

    <!-- Full KYC Modal -->
    <div id="kyc-modal" class="hidden fixed inset-0 bg-black/95 z-[500] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-4xl rounded-[2.5rem] p-10 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="font-black text-xl text-[#D4AF37] mb-1">Verify Identity</h3>
                    <p id="kyc-user-info" class="text-xs text-slate-400 font-bold uppercase tracking-widest"></p>
                </div>
                <button onclick="document.getElementById('kyc-modal').classList.add('hidden')" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-6 kyc-grid">
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">ID Front</label><img id="img-front" src=""></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">ID Back</label><img id="img-back" src=""></div>
                <div><label class="text-[10px] font-black uppercase text-slate-500 block mb-2">Selfie</label><img id="img-selfie" src=""></div>
            </div>
            <div class="mt-10 flex gap-4">
                <button id="kyc-approve" class="flex-1 bg-emerald-600 p-4 rounded-2xl font-black uppercase text-xs">Approve Documents</button>
                <button id="kyc-reject" class="flex-1 bg-rose-600 p-4 rounded-2xl font-black uppercase text-xs">Reject & Request Re-upload</button>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/90 z-[400] flex items-center justify-center p-6">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-3xl p-8 border border-slate-700 h-[650px] flex flex-col shadow-2xl">
            <div id="chat-header" class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center"></div>
            <div id="chat-flow" class="flex-1 pr-2"></div>
            <div class="mt-6 flex gap-2">
                <input type="text" id="admin-reply" class="flex-1 bg-slate-900 border-slate-700 rounded-xl px-4 text-sm" placeholder="Type message...">
                <button id="send-reply" class="bg-[#D4AF37] text-[#002147] px-6 rounded-xl font-black uppercase text-[10px]">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, runTransaction, serverTimestamp, getDocs, where, addDoc, arrayUnion, increment, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';
        import { showToast } from './toast.js';

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            initUnreadListener();
        });

        let currentTab = 'users';

        // Feature 4: Unread Badge Listener
        function initUnreadListener() {
            onSnapshot(query(collection(db, "supportTickets"), where("status", "==", "OPEN")), snap => {
                const count = snap.size;
                const badge = document.getElementById('unread-count');
                if(count > 0) { badge.innerText = count; badge.classList.remove('hidden'); }
                else { badge.classList.add('hidden'); }
            });
        }

        window.loadTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.admin-sidebar-item').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
            });
            document.getElementById('tab-title').innerText = tab.replace(/([A-Z])/g, ' $1');
            renderData();
        };

        const renderData = () => {
            const container = document.getElementById('tab-content');
            
            // Feature 1: User List Order by Date DESC
            if (currentTab === 'users') {
                onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), async (snap) => {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    
                    container.innerHTML = `<table class="tb-table w-full">
                        <thead><tr><th>Reg Date</th><th>User</th><th>Balance</th><th>KYC</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(uDoc => {
                            const u = uDoc.data(); const a = accMap[u.uid] || {};
                            return `<tr>
                                <td class="text-slate-500">${formatDate(u.createdAt)}</td>
                                <td><p class="font-bold">${u.fullName}</p><p class="text-[9px] uppercase text-slate-500">${u.email}</p></td>
                                <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance)}</td>
                                <td><span class="text-[9px] font-black uppercase px-2 py-0.5 rounded bg-slate-800">${u.kycStatus}</span></td>
                                <td><button onclick="manageBalance('${u.uid}', '${u.fullName}')" class="text-blue-400 font-bold uppercase text-[9px]">Adjust Balance</button></td>
                            </tr>`;
                        }).join('')}</tbody></table>`;
                });
            }

            // Feature 2: Full KYC View
            if (currentTab === 'kyc') {
                onSnapshot(collection(db, "kyc"), snap => {
                    container.innerHTML = `<div class="grid grid-cols-2 gap-4">${snap.docs.map(kDoc => {
                        const k = kDoc.data();
                        return `<div class="bg-[#1e293b] p-5 rounded-2xl border border-slate-800">
                            <div class="flex justify-between items-center mb-4">
                                <p class="text-xs font-black uppercase">UID: ${k.uid.slice(0,10)}...</p>
                                <span class="text-[9px] font-black px-2 py-1 rounded bg-amber-500/10 text-amber-500">${k.status}</span>
                            </div>
                            <button onclick="viewFullKYC('${kDoc.id}')" class="w-full bg-slate-800 p-3 rounded-xl text-[10px] font-black uppercase hover:bg-slate-700">Open Documents</button>
                        </div>`;
                    }).join('')}</div>`;
                });
            }

            // Feature 4: Live Support Tabs
            if (currentTab === 'supportTickets') {
                onSnapshot(query(collection(db, "supportTickets"), orderBy("createdAt", "desc")), snap => {
                    container.innerHTML = `<div class="space-y-3">${snap.docs.map(tDoc => {
                        const t = tDoc.data();
                        return `<div onclick="openChat('${tDoc.id}')" class="bg-[#1e293b] p-4 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-[#D4AF37]">
                            <div><p class="font-bold text-sm">${t.subject}</p><p class="text-[9px] text-slate-500">ID: ${tDoc.id}</p></div>
                            <span class="text-[9px] font-black uppercase ${t.status === 'OPEN' ? 'text-emerald-400' : 'text-slate-500'}">${t.status}</span>
                        </div>`;
                    }).join('')}</div>`;
                });
            }

            // Feature 3 Audit Log: Audit View
            if (currentTab === 'transactions') {
                onSnapshot(query(collection(db, "transactions"), orderBy("timestamp", "desc")), snap => {
                    container.innerHTML = `<table class="tb-table w-full"><thead><tr><th>Date</th><th>Type</th><th>UID</th><th>Amount</th><th>Reason</th></tr></thead>
                        <tbody>${snap.docs.map(tDoc => {
                            const t = tDoc.data();
                            return `<tr>
                                <td class="text-slate-500">${formatDate(t.timestamp)}</td>
                                <td class="font-black text-[9px] uppercase">${t.type}</td>
                                <td class="font-mono text-slate-500">${t.uid.slice(0,8)}...</td>
                                <td class="${t.direction === 'credit' ? 'text-emerald-500' : 'text-rose-500'} font-black">${formatCurrency(t.amount)}</td>
                                <td class="italic text-slate-400">${t.description}</td>
                            </tr>`;
                        }).join('')}</tbody></table>`;
                });
            }
        };

        // Feature 3 Implementation: Add/Remove Money
        window.manageBalance = async (uid, name) => {
            const amount = prompt(`Adjust Balance for ${name}\nPositive for Credit, Negative for Debit:`);
            if(!amount || isNaN(amount)) return;
            const reason = prompt(`Reason for Adjustment (Required):`);
            if(!reason) return showToast("Reason required", "error");

            const val = parseFloat(amount);
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
            const accRef = doc(db, "accounts", accQ.docs[0].id);

            await updateDoc(accRef, { 
                availableBalance: increment(val),
                totalBalance: increment(val)
            });

            await addDoc(collection(db, "transactions"), {
                uid, amount: Math.abs(val), direction: val > 0 ? 'credit' : 'debit',
                type: 'ADJUSTMENT', description: reason, timestamp: serverTimestamp(), status: 'SUCCESSFUL'
            });
            showToast("Balance Updated Successfully");
        };

        // Feature 2 Implementation: View KYC Details
        window.viewFullKYC = async (id) => {
            const docRef = doc(db, "kyc", id);
            const snap = await getDocs(query(collection(db, "kyc"), where("__name__", "==", id)));
            const k = snap.docs[0].data();

            document.getElementById('img-front').src = k.documentFront || '';
            document.getElementById('img-back').src = k.documentBack || '';
            document.getElementById('img-selfie').src = k.documentSelfie || '';
            document.getElementById('kyc-user-info').innerText = `Document Type: ${k.documentType} | UID: ${k.uid}`;
            document.getElementById('kyc-modal').classList.remove('hidden');

            document.getElementById('kyc-approve').onclick = async () => {
                await updateDoc(docRef, { status: 'VERIFIED' });
                await updateDoc(doc(db, "users", k.uid), { kycStatus: 'VERIFIED' });
                document.getElementById('kyc-modal').classList.add('hidden');
                showToast("User Verified");
            };
            document.getElementById('kyc-reject').onclick = async () => {
                const r = prompt("Reason for rejection:");
                await updateDoc(docRef, { status: 'REJECTED', declineReason: r });
                await updateDoc(doc(db, "users", k.uid), { kycStatus: 'REJECTED' });
                document.getElementById('kyc-modal').classList.add('hidden');
                showToast("KYC Rejected");
            };
        };

        // Feature 4: Chat Engine
        let activeChatId = null;
        window.openChat = (id) => {
            activeChatId = id;
            const modal = document.getElementById('chat-modal');
            const flow = document.getElementById('chat-flow');
            modal.classList.remove('hidden');

            onSnapshot(doc(db, "supportTickets", id), snap => {
                const t = snap.data();
                document.getElementById('chat-header').innerHTML = `<div><p class="font-black text-[#D4AF37]">${t.subject}</p></div>`;
                flow.innerHTML = t.messages.map(m => `
                    <div class="max-w-[85%] p-3 rounded-2xl ${m.sender === 'admin' ? 'bg-blue-600 self-end rounded-tr-none' : 'bg-slate-800 self-start rounded-tl-none'}">
                        <p class="text-xs">${m.text}</p>
                    </div>`).join('');
                flow.scrollTop = flow.scrollHeight;
            });

            document.getElementById('send-reply').onclick = async () => {
                const input = document.getElementById('admin-reply');
                if(!input.value) return;
                await updateDoc(doc(db, "supportTickets", id), {
                    messages: arrayUnion({ sender: "admin", text: input.value, timestamp: new Date().toISOString() }),
                    status: "PENDING"
                });
                input.value = "";
            };
        };

        window.loadTab('users');
    </script>
</body>
</html>
