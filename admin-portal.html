<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Master Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-btn.active { background: #334155; color: white; border-color: #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; text-align: left; border-bottom: 2px solid #334155; }
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        
        #chat-body { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 14px; border-radius: 15px; font-size: 12px; line-height: 1.4; }
        .msg-user { background: #1e293b; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg-admin { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <nav class="bg-[#1e293b] p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="font-black uppercase tracking-widest text-sm text-[#D4AF37]">Admin Console</h1>
        <div class="flex items-center gap-6">
            <div id="msg-alert" class="hidden w-3 h-3 bg-rose-500 rounded-full animate-ping"></div>
            <span id="admin-email" class="text-[10px] font-bold text-slate-400 uppercase">---</span>
            <button id="logout-btn" class="bg-rose-500/10 text-rose-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Logout</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
            <button class="tab-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="users">Users</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="supportTickets">Live Support</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="deposits">Deposits</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="withdrawals">Withdrawals</button>
        </div>

        <div id="tab-content" class="bg-[#1e293b]/30 rounded-[2rem] border border-slate-800 p-8"></div>
    </div>

    <!-- Admin Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/80 z-[200] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-[2rem] p-8 border border-slate-700 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-4">
                <div>
                    <h3 id="chat-title" class="font-black uppercase text-sm">Chat</h3>
                    <p id="chat-user-id" class="text-[8px] text-slate-500 font-bold uppercase"></p>
                </div>
                <button onclick="closeAdminChat()" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-body" class="pr-2"></div>
            <div class="mt-6 flex gap-2">
                <input type="text" id="admin-reply-input" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 text-sm" placeholder="Type a reply...">
                <button id="send-reply-btn" class="bg-[#D4AF37] text-navy-900 px-6 rounded-xl font-black uppercase text-[10px]">Reply</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, arrayUnion, getDocs, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency } from './utils.js';
        import { showToast } from './toast.js';

        let activeChatListener = null;

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            document.getElementById('admin-email').innerText = user.email;
        });

        const loadTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            const container = document.getElementById('tab-content');

            onSnapshot(collection(db, tab), (snap) => {
                if (tab === 'supportTickets') {
                    container.innerHTML = `
                        <table class="tb-table w-full">
                            <thead><tr><th>User</th><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${snap.docs.map(d => {
                                const t = d.data();
                                return `<tr>
                                    <td class="font-mono text-slate-500">${t.uid.slice(0,8)}...</td>
                                    <td class="font-bold">${t.subject}</td>
                                    <td><span class="${t.status === 'OPEN' ? 'text-emerald-400' : 'text-slate-500'} font-black text-[9px] uppercase">${t.status}</span></td>
                                    <td><button onclick="openAdminChat('${d.id}', '${t.subject}', '${t.uid}')" class="bg-blue-600 px-3 py-1 rounded text-[9px] uppercase font-black">Open Chat</button></td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>`;
                } else if (tab === 'users') {
                    // Logic to list users...
                    container.innerHTML = `<p class="text-slate-500 text-xs">Switch to Users tab to manage balances.</p>`;
                }
            });
        };

        window.openAdminChat = (ticketId, subject, uid) => {
            const modal = document.getElementById('chat-modal');
            const body = document.getElementById('chat-body');
            document.getElementById('chat-title').innerText = subject;
            document.getElementById('chat-user-id').innerText = `User: ${uid}`;
            modal.classList.remove('hidden');

            if (activeChatListener) activeChatListener(); // Clear old listener

            activeChatListener = onSnapshot(doc(db, "supportTickets", ticketId), (snap) => {
                const data = snap.data();
                if (!data) return;
                body.innerHTML = data.messages.map(m => `
                    <div class="msg ${m.sender === 'admin' ? 'msg-admin' : 'msg-user'}">
                        ${m.text}
                    </div>
                `).join('');
                body.scrollTop = body.scrollHeight;
            });

            document.getElementById('send-reply-btn').onclick = async () => {
                const input = document.getElementById('admin-reply-input');
                if (!input.value) return;
                await updateDoc(doc(db, "supportTickets", ticketId), {
                    messages: arrayUnion({
                        sender: "admin",
                        text: input.value,
                        timestamp: new Date().toISOString()
                    }),
                    status: "PENDING"
                });
                input.value = "";
            };
        };

        window.closeAdminChat = () => {
            if (activeChatListener) activeChatListener();
            document.getElementById('chat-modal').classList.add('hidden');
        };

        document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => loadTab(b.dataset.tab));
        loadTab('users');
    </script>
</body>
</html>
