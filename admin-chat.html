--- FILE: admin-portal.html ---

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Command Center | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap');
        body { font-family: 'Public Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .admin-sidebar-item { border-left: 4px solid transparent; transition: 0.2s; }
        .admin-sidebar-item.active { background: #334155; color: #D4AF37; border-left: 4px solid #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; border-bottom: 2px solid #334155; text-align: left;}
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        #chat-flow { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .msg-bubble { max-width: 80%; padding: 10px; border-radius: 12px; font-size: 12px; }
        .msg-admin { background: #D4AF37; color: #002147; align-self: flex-end; border-bottom-right-radius: 2px; }
        .msg-user { background: #334155; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .kyc-grid img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; border: 1px solid #334155; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-[#1e293b] border-r border-slate-800 flex flex-col sticky top-0 h-screen">
        <div class="p-6 border-b border-slate-800">
            <h1 class="font-black text-[#D4AF37] tracking-tighter text-xl">TRUST ADMIN</h1>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="loadTab('users')" class="admin-sidebar-item active w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold"><i class="fa-solid fa-users"></i> Users</button>
            <button onclick="loadTab('approvals')" class="admin-sidebar-item w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold"><i class="fa-solid fa-clock"></i> Approvals</button>
            <button onclick="loadTab('kyc')" class="admin-sidebar-item w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold"><i class="fa-solid fa-id-card"></i> KYC Vault</button>
            <button onclick="loadTab('supportTickets')" class="admin-sidebar-item w-full flex items-center justify-between p-3 rounded-lg text-sm font-bold">
                <span><i class="fa-solid fa-headset mr-3"></i> Support</span>
                <span id="global-unread" class="hidden bg-rose-500 text-white text-[10px] px-2 py-0.5 rounded-full">0</span>
            </button>
            <button onclick="loadTab('transactions')" class="admin-sidebar-item w-full flex items-center gap-3 p-3 rounded-lg text-sm font-bold"><i class="fa-solid fa-receipt"></i> Audit Logs</button>
        </nav>
        <div class="p-4 border-t border-slate-800">
            <button id="logout-btn" class="w-full bg-rose-500/10 text-rose-500 p-3 rounded-lg text-xs font-black uppercase">Sign Out</button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
        <header class="p-6 bg-[#1e293b]/50 border-b border-slate-800 flex justify-between items-center">
            <h2 id="tab-title" class="font-black uppercase tracking-widest text-sm">Users List</h2>
            <div class="relative w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                <input type="text" id="admin-search" placeholder="Search records..." class="w-full bg-slate-900 border-slate-700 pl-10 text-xs rounded-xl h-10 text-white outline-none focus:border-[#D4AF37]">
            </div>
        </header>

        <section id="tab-content" class="p-8 overflow-y-auto"></section>
    </main>

    <!-- KYC Modal -->
    <div id="kyc-modal" class="hidden fixed inset-0 bg-black/95 z-[500] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-4xl rounded-3xl p-10 border border-slate-700 shadow-2xl">
            <div class="flex justify-between items-start mb-8">
                <div>
                    <h3 class="font-black text-xl text-[#D4AF37]">Identity Verification</h3>
                    <p id="kyc-user-info" class="text-[10px] text-slate-400 font-bold uppercase mt-1"></p>
                </div>
                <button onclick="closeModal('kyc-modal')" class="text-slate-500 hover:text-white"><i class="fa-solid fa-xmark text-2xl"></i></button>
            </div>
            <div class="grid grid-cols-3 gap-6 kyc-grid">
                <div><label class="text-[9px] font-black uppercase text-slate-500 mb-2 block">Front</label><img id="img-front" src=""></div>
                <div><label class="text-[9px] font-black uppercase text-slate-500 mb-2 block">Back</label><img id="img-back" src=""></div>
                <div><label class="text-[9px] font-black uppercase text-slate-500 mb-2 block">Selfie</label><img id="img-selfie" src=""></div>
            </div>
            <div class="mt-10 flex gap-4">
                <button id="kyc-approve" class="flex-1 bg-emerald-600 p-4 rounded-xl font-black uppercase text-xs">Verify User</button>
                <button id="kyc-reject" class="flex-1 bg-rose-600 p-4 rounded-xl font-black uppercase text-xs">Reject Documents</button>
            </div>
        </div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/90 z-[400] flex items-center justify-center p-6">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-3xl p-8 border border-slate-700 h-[600px] flex flex-col shadow-2xl">
            <div class="mb-6 border-b border-slate-700 pb-4 flex justify-between items-center">
                <h3 id="chat-user-title" class="font-black text-[#D4AF37]">Chat Session</h3>
                <button onclick="closeModal('chat-modal')" class="text-slate-500"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-flow" class="flex-1"></div>
            <div class="mt-6 flex gap-2">
                <input type="text" id="admin-reply" class="flex-1 bg-slate-900 border-none rounded-xl px-4 text-sm text-white" placeholder="Type a message...">
                <button id="send-reply" class="bg-[#D4AF37] text-[#002147] px-6 rounded-xl font-black uppercase text-[10px]">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, getDocs, where, addDoc, arrayUnion, increment, orderBy, serverTimestamp, getDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';
        import { showToast } from './toast.js';

        // Security Check
        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
        });

        document.getElementById('logout-btn').onclick = () => auth.signOut();

        let currentTab = 'users';
        let activeChatUid = null;

        window.loadTab = (tab) => {
            currentTab = tab;
            document.querySelectorAll('.admin-sidebar-item').forEach(b => {
                b.classList.toggle('active', b.getAttribute('onclick').includes(tab));
            });
            document.getElementById('tab-title').innerText = tab.replace(/([A-Z])/g, ' $1');
            renderData();
        };

        window.closeModal = (id) => document.getElementById(id).classList.add('hidden');

        const renderData = () => {
            const container = document.getElementById('tab-content');
            container.innerHTML = `<div class="flex items-center justify-center py-20 text-slate-500"><i class="fa-solid fa-circle-notch fa-spin text-2xl mr-3"></i> Loading...</div>`;

            // 1. USERS LIST
            if (currentTab === 'users') {
                onSnapshot(query(collection(db, "users"), orderBy("createdAt", "desc")), async (snap) => {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    
                    container.innerHTML = `<table class="tb-table w-full">
                        <thead><tr><th>User</th><th>Balance</th><th>KYC</th><th>Created</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(uDoc => {
                            const u = uDoc.data(); const a = accMap[u.uid] || {};
                            return `<tr>
                                <td><p class="font-bold">${u.fullName}</p><p class="text-[9px] text-slate-500 uppercase">${u.email}</p></td>
                                <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance)}</td>
                                <td><span class="px-2 py-0.5 rounded bg-slate-800 text-[9px] font-black">${u.kycStatus || 'NONE'}</span></td>
                                <td class="text-slate-500">${formatDate(u.createdAt)}</td>
                                <td><button onclick="adjustBalance('${u.uid}', '${u.fullName}')" class="text-blue-400 font-bold text-[9px] uppercase">Manual Adjust</button></td>
                            </tr>`;
                        }).join('')}</tbody></table>`;
                });
            }

            // 2. TRANSACTION APPROVALS
            if (currentTab === 'approvals') {
                container.innerHTML = `<div id="approval-stack" class="space-y-4"></div>`;
                const types = ['deposits', 'withdrawals', 'transfers'];
                types.forEach(type => {
                    onSnapshot(query(collection(db, type), where("status", "==", "PENDING")), snap => {
                        const stack = document.getElementById('approval-stack');
                        if(snap.empty) return;
                        snap.docs.forEach(dDoc => {
                            const d = dDoc.data();
                            const id = dDoc.id;
                            stack.innerHTML += `
                                <div class="bg-[#1e293b] p-6 rounded-2xl border border-slate-800 flex justify-between items-center animate-in fade-in">
                                    <div>
                                        <p class="text-[10px] font-black text-[#D4AF37] uppercase mb-1">${type.slice(0,-1)} Request</p>
                                        <h3 class="text-xl font-black">${formatCurrency(d.amount)}</h3>
                                        <p class="text-[10px] text-slate-500 uppercase mt-1">UID: ${d.uid.slice(0,10)}... | ${d.method || d.recipientAcc || 'P2P'}</p>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="processTx('${type}', '${id}', 'APPROVED')" class="bg-emerald-600 px-6 py-3 rounded-xl text-[10px] font-black uppercase">Approve</button>
                                        <button onclick="processTx('${type}', '${id}', 'DECLINED')" class="bg-rose-600 px-6 py-3 rounded-xl text-[10px] font-black uppercase">Decline</button>
                                    </div>
                                </div>`;
                        });
                    });
                });
            }

            // 3. KYC VAULT
            if (currentTab === 'kyc') {
                onSnapshot(query(collection(db, "kyc"), where("status", "==", "PENDING")), snap => {
                    if (snap.empty) { container.innerHTML = `<div class="text-center py-20 text-slate-600 font-bold uppercase text-xs">No pending identities</div>`; return; }
                    container.innerHTML = `<div class="grid grid-cols-2 gap-4">${snap.docs.map(kDoc => {
                        const k = kDoc.data();
                        return `<div class="bg-[#1e293b] p-6 rounded-2xl border border-slate-800">
                            <p class="text-[10px] font-black uppercase text-slate-500 mb-2">UID: ${k.uid.slice(0,12)}...</p>
                            <h4 class="font-black text-sm mb-4">${k.documentType} Verification</h4>
                            <button onclick="viewKYC('${k.uid}')" class="w-full bg-slate-800 p-3 rounded-xl text-[10px] font-black uppercase hover:bg-slate-700">Open Documents</button>
                        </div>`;
                    }).join('')}</div>`;
                });
            }

            // 4. SUPPORT CHATS
            if (currentTab === 'supportTickets') {
                onSnapshot(query(collection(db, "supportTickets"), orderBy("lastTimestamp", "desc")), snap => {
                    container.innerHTML = `<div class="grid gap-3">${snap.docs.map(tDoc => {
                        const t = tDoc.data();
                        return `<div onclick="openChat('${tDoc.id}')" class="bg-[#1e293b] p-5 rounded-2xl border border-slate-800 flex justify-between items-center cursor-pointer hover:border-[#D4AF37]">
                            <div class="flex items-center gap-4">
                                <div class="w-10 h-10 bg-slate-900 rounded-full flex items-center justify-center text-[#D4AF37]"><i class="fa-solid fa-comment"></i></div>
                                <div><p class="font-bold text-sm">User: ${tDoc.id.slice(0,8)}</p><p class="text-[10px] text-slate-500 truncate w-64">${t.lastMessage || 'Sent a message'}</p></div>
                            </div>
                            ${t.unreadAdminCount > 0 ? `<span class="bg-rose-600 text-white text-[10px] px-2 rounded-full font-bold">${t.unreadAdminCount}</span>` : '<i class="fa-solid fa-chevron-right text-slate-700"></i>'}
                        </div>`;
                    }).join('')}</div>`;
                });
            }

            // 5. AUDIT LOGS
            if (currentTab === 'transactions') {
                onSnapshot(query(collection(db, "transactions"), orderBy("timestamp", "desc")), snap => {
                    container.innerHTML = `<table class="tb-table w-full"><thead><tr><th>Date</th><th>Type</th><th>Amount</th><th>Status</th><th>User</th></tr></thead>
                        <tbody>${snap.docs.map(tDoc => {
                            const t = tDoc.data();
                            return `<tr>
                                <td class="text-slate-500">${formatDate(t.timestamp)}</td>
                                <td class="font-black uppercase text-[10px]">${t.type}</td>
                                <td class="${t.direction === 'credit' ? 'text-emerald-500' : 'text-rose-500'} font-black">${formatCurrency(t.amount)}</td>
                                <td><span class="text-[9px] font-bold uppercase text-emerald-400">Successful</span></td>
                                <td class="text-slate-500 font-mono">${t.uid.slice(0,10)}...</td>
                            </tr>`;
                        }).join('')}</tbody></table>`;
                });
            }
        };

        // --- TRANSACTION PROCESSOR ---
        window.processTx = async (coll, id, status) => {
            const docRef = doc(db, coll, id);
            const snap = await getDoc(docRef);
            const data = snap.data();

            if (status === 'DECLINED') {
                const reason = prompt("Enter decline reason:");
                if (!reason) return;
                await updateDoc(docRef, { status: 'DECLINED', declineReason: reason });
                showToast("Request Declined");
                return;
            }

            // Approve Logic: Find account and increment
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", data.uid)));
            if (accQ.empty) return showToast("No account found", "error");
            
            const accRef = doc(db, "accounts", accQ.docs[0].id);
            let change = data.amount;
            if (coll === 'withdrawals' || coll === 'transfers') change = -data.amount;

            await updateDoc(accRef, { availableBalance: increment(change), totalBalance: increment(change) });
            await updateDoc(docRef, { status: 'APPROVED' });
            
            // Log to itemized history
            await addDoc(collection(db, "transactions"), {
                uid: data.uid, amount: data.amount, direction: change > 0 ? 'credit' : 'debit',
                type: coll.toUpperCase(), timestamp: serverTimestamp()
            });

            showToast("Approved & Balance Updated");
            loadTab('approvals');
        };

        // --- MANUAL BALANCE ADJUST ---
        window.adjustBalance = async (uid, name) => {
            const amt = prompt(`Adjust Balance for ${name}:\n(Positive for credit, Negative for debit)`);
            if (!amt || isNaN(amt)) return;
            const reason = prompt("Reason for adjustment:");
            
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
            const accRef = doc(db, "accounts", accQ.docs[0].id);

            await updateDoc(accRef, { availableBalance: increment(parseFloat(amt)), totalBalance: increment(parseFloat(amt)) });
            await addDoc(collection(db, "transactions"), {
                uid, amount: Math.abs(amt), direction: amt > 0 ? 'credit' : 'debit',
                type: 'ADMIN ADJUST', description: reason, timestamp: serverTimestamp()
            });
            showToast("Balance Manually Adjusted");
        };

        // --- KYC VIEWING ---
        window.viewKYC = async (uid) => {
            const kSnap = await getDoc(doc(db, "kyc", uid));
            const k = kSnap.data();
            document.getElementById('img-front').src = k.documentFront;
            document.getElementById('img-back').src = k.documentBack;
            document.getElementById('img-selfie').src = k.documentSelfie;
            document.getElementById('kyc-user-info').innerText = `DOC: ${k.documentType} | UID: ${uid}`;
            document.getElementById('kyc-modal').classList.remove('hidden');

            document.getElementById('kyc-approve').onclick = async () => {
                await updateDoc(doc(db, "kyc", uid), { status: 'VERIFIED' });
                await updateDoc(doc(db, "users", uid), { kycStatus: 'VERIFIED' });
                closeModal('kyc-modal');
                showToast("Identity Verified");
                loadTab('kyc');
            };
            document.getElementById('kyc-reject').onclick = async () => {
                const r = prompt("Reason for rejection:");
                await updateDoc(doc(db, "kyc", uid), { status: 'DECLINED', declineReason: r });
                await updateDoc(doc(db, "users", uid), { kycStatus: 'DECLINED' });
                closeModal('kyc-modal');
                showToast("Identity Rejected");
                loadTab('kyc');
            };
        };

        // --- CHAT SYSTEM ---
        window.openChat = (uid) => {
            activeChatUid = uid;
            document.getElementById('chat-user-title').innerText = `Chat: ${uid.slice(0,10)}`;
            document.getElementById('chat-modal').classList.remove('hidden');
            const flow = document.getElementById('chat-flow');

            onSnapshot(query(collection(db, "supportTickets", uid, "messages"), orderBy("timestamp", "asc")), snap => {
                flow.innerHTML = snap.docs.map(d => {
                    const m = d.data();
                    const isAdmin = m.senderRole === 'admin';
                    return `<div class="flex flex-col ${isAdmin ? 'items-end' : 'items-start'} mb-1">
                        <div class="msg-bubble ${isAdmin ? 'msg-admin' : 'msg-user'}">${m.text}</div>
                    </div>`;
                }).join('');
                flow.scrollTop = flow.scrollHeight;
                updateDoc(doc(db, "supportTickets", uid), { unreadAdminCount: 0 });
            });
        };

        document.getElementById('send-reply').onclick = async () => {
            const input = document.getElementById('admin-reply');
            if (!input.value || !activeChatUid) return;
            const text = input.value;
            input.value = "";

            await addDoc(collection(db, "supportTickets", activeChatUid, "messages"), {
                text, senderRole: 'admin', timestamp: serverTimestamp()
            });
            await updateDoc(doc(db, "supportTickets", activeChatUid), {
                lastMessage: text, lastTimestamp: serverTimestamp(), unreadUserCount: increment(1)
            });
        };

        // Global Unread Listener
        onSnapshot(collection(db, "supportTickets"), snap => {
            let total = 0;
            snap.docs.forEach(d => total += (d.data().unreadAdminCount || 0));
            const badge = document.getElementById('global-unread');
            if(total > 0) { badge.innerText = total; badge.classList.remove('hidden'); }
            else { badge.classList.add('hidden'); }
        });

        loadTab('users');
    </script>
</body>
</html>
