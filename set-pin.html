<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Set Security PIN | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-6">
    <div class="max-w-md w-full bg-white tb-card p-10 text-center">
        <div class="w-16 h-16 bg-[#002147] text-[#D4AF37] rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-lg">
            <i class="fa-solid fa-shield-halved text-2xl"></i>
        </div>
        <h1 class="text-2xl font-black text-[#002147] mb-2 tracking-tight">Setup Security PIN</h1>
        <p class="text-slate-400 text-sm mb-8">This 4-6 digit code will be required for all transactions.</p>
        
        <form id="pin-form" class="space-y-6 text-left">
            <div>
                <label>Enter PIN</label>
                <input type="password" id="pin" class="w-full text-center text-2xl tracking-[1em]" inputmode="numeric" maxlength="6" required>
            </div>
            <div>
                <label>Confirm PIN</label>
                <input type="password" id="confirmPin" class="w-full text-center text-2xl tracking-[1em]" inputmode="numeric" maxlength="6" required>
            </div>
            <button type="submit" id="btn" class="w-full btn-primary h-14">Secure My Account</button>
        </form>
    </div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { hashString } from './utils.js';
        import { showToast } from './toast.js';

        document.getElementById('pin-form').onsubmit = async (e) => {
            e.preventDefault();
            const pin = document.getElementById('pin').value;
            if (pin.length < 4) return showToast("PIN must be 4-6 digits", "error");
            if (pin !== document.getElementById('confirmPin').value) return showToast("PINs don't match", "error");

            const hashed = await hashString(pin);
            await updateDoc(doc(db, "users", auth.currentUser.uid), { pinHash: hashed });
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
