<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-btn.active { background: #334155; color: white; border-color: #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; text-align: left; border-bottom: 2px solid #334155; }
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        
        /* Chat Bubble Styles */
        #chat-body { height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 8px; }
        #chat-body::-webkit-scrollbar { width: 4px; }
        #chat-body::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 13px; line-height: 1.5; position: relative; }
        .bubble-user { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #334155; }
        .bubble-admin { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
        .bubble-meta { font-size: 8px; font-weight: 900; text-transform: uppercase; margin-top: 6px; opacity: 0.6; display: block; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <nav class="bg-[#1e293b] p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="font-black uppercase tracking-widest text-sm text-[#D4AF37]">Admin Master Control</h1>
        <div class="flex items-center gap-6">
            <div id="msg-notify-dot" class="hidden w-3 h-3 bg-rose-500 rounded-full animate-pulse shadow-[0_0_10px_#f43f5e]"></div>
            <span id="admin-email" class="text-[10px] font-bold text-slate-400 uppercase">---</span>
            <button id="logout-btn" class="bg-rose-500/10 text-rose-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Exit</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
            <button class="tab-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="users">Users</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="deposits">Deposits</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="withdrawals">Withdrawals</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="transfers">Transfers</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="supportTickets">Live Support</button>
        </div>

        <div id="tab-content" class="bg-[#1e293b]/30 rounded-[2rem] border border-slate-800 p-8"></div>
    </div>

    <!-- Admin Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-[2.5rem] p-8 border border-slate-700 shadow-2xl flex flex-col">
            <div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-4">
                <div>
                    <h3 id="chat-subject" class="font-black uppercase text-sm text-[#D4AF37]">Subject</h3>
                    <p id="chat-user-email" class="text-[9px] text-slate-500 font-bold uppercase tracking-widest mt-1">Loading user...</p>
                </div>
                <button onclick="closeAdminChat()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-400 hover:text-white transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="chat-body">
                <!-- Messages flow here -->
            </div>

            <div class="mt-6 flex gap-2 bg-slate-900 p-2 rounded-2xl border border-slate-700">
                <input type="text" id="admin-reply-input" class="flex-1 bg-transparent border-none focus:ring-0 text-sm px-4 text-white" placeholder="Type your reply here...">
                <button id="send-reply-btn" class="bg-[#D4AF37] text-[#002147] px-6 py-3 rounded-xl font-black uppercase text-[10px] active:scale-95 transition-transform">
                    Reply
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, runTransaction, serverTimestamp, getDocs, where, addDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency, formatDate } from './utils.js';
        import { showToast } from './toast.js';

        let chatUnsubscribe = null;
        let activeChatId = null;

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            document.getElementById('admin-email').innerText = user.email;
        });

        const loadTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            const content = document.getElementById('tab-content');
            
            onSnapshot(collection(db, tab), async (snap) => {
                if (tab === 'supportTickets') {
                    content.innerHTML = `
                        <table class="tb-table w-full">
                            <thead><tr><th>Inquiry</th><th>User UID</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${snap.docs.map(tDoc => {
                                const t = tDoc.data();
                                const isNew = t.status === 'OPEN';
                                return `<tr>
                                    <td><p class="font-bold">${t.subject}</p>${isNew ? '<span class="text-[7px] bg-rose-500 text-white px-1.5 py-0.5 rounded ml-2 uppercase">New</span>' : ''}</td>
                                    <td class="font-mono text-slate-500">${t.uid.slice(0,10)}...</td>
                                    <td><span class="text-[9px] font-black uppercase ${t.status === 'OPEN' ? 'text-emerald-400' : 'text-slate-500'}">${t.status}</span></td>
                                    <td><button onclick="openAdminChat('${tDoc.id}', '${t.subject}', '${t.uid}')" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-black uppercase text-[9px]">Open Chat</button></td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>`;
                } else if (tab === 'users') {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    content.innerHTML = `<table class="tb-table w-full"><thead><tr><th>User</th><th>Balance</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(uDoc => {
                            const u = uDoc.data();
                            const a = accMap[u.uid] || {};
                            return `<tr><td>${u.fullName}<br><span class="text-[9px] text-slate-500 font-bold uppercase">${u.email}</span></td>
                            <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance)}</td>
                            <td><button onclick="manageUser('${u.uid}', '${u.fullName}')" class="bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg font-black uppercase text-[9px]">Adjust</button></td></tr>`;
                        }).join('')}</tbody></table>`;
                } else {
                    content.innerHTML = `<table class="tb-table w-full"><thead><tr><th>ID</th><th>Value</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${snap.docs.map(dDoc => {
                            const d = dDoc.data();
                            return `<tr><td>${dDoc.id.slice(0,6)}</td><td class="font-black">${formatCurrency(d.amount)}</td><td>${d.status}</td>
                            <td>${d.status === 'PENDING' ? `<button onclick="approveRequest('${tab}', '${dDoc.id}')" class="text-emerald-400 mr-3">Approve</button><button onclick="declinePrompt('${tab}', '${dDoc.id}')" class="text-rose-400">Decline</button>` : 'Processed'}</td></tr>`;
                        }).join('')}</tbody></table>`;
                }
            });
        };

        // --- CHAT LOGIC ---

        window.openAdminChat = (id, subject, uid) => {
            activeChatId = id;
            if (chatUnsubscribe) chatUnsubscribe();
            
            const modal = document.getElementById('chat-modal');
            const body = document.getElementById('chat-body');
            document.getElementById('chat-subject').innerText = subject;
            document.getElementById('chat-user-email').innerText = `User ID: ${uid}`;
            modal.classList.remove('hidden');

            // Listen to this specific chat live
            chatUnsubscribe = onSnapshot(doc(db, "supportTickets", id), (snap) => {
                const data = snap.data();
                if (!data) return;

                body.innerHTML = data.messages.map(m => {
                    const isAdmin = m.sender === 'admin';
                    return `
                        <div class="bubble ${isAdmin ? 'bubble-admin' : 'bubble-user'}">
                            <p>${m.text}</p>
                            <span class="bubble-meta">${isAdmin ? 'You' : 'Customer'} • ${new Date(m.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                        </div>
                    `;
                }).join('');
                body.scrollTop = body.scrollHeight;
            });

            // Set up Send Button
            document.getElementById('send-reply-btn').onclick = async () => {
                const input = document.getElementById('admin-reply-input');
                const text = input.value.trim();
                if (!text) return;

                try {
                    await updateDoc(doc(db, "supportTickets", id), {
                        messages: arrayUnion({
                            sender: "admin",
                            text: text,
                            timestamp: new Date().toISOString()
                        }),
                        status: "PENDING" // Set to Pending so admin knows they are waiting on user
                    });
                    input.value = "";
                } catch (err) {
                    showToast("Error sending reply", "error");
                }
            };
        };

        window.closeAdminChat = () => {
            if (chatUnsubscribe) chatUnsubscribe();
            document.getElementById('chat-modal').classList.add('hidden');
            activeChatId = null;
        };

        // Other admin functions (Approve/Manage)
        window.approveRequest = async (type, id) => {
            try {
                await runTransaction(db, async (transaction) => {
                    const reqRef = doc(db, type, id);
                    const reqSnap = await transaction.get(reqRef);
                    const req = reqSnap.data();
                    const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", req.uid)));
                    const accRef = doc(db, "accounts", accQ.docs[0].id);
                    const acc = accQ.docs[0].data();
                    const amount = type === 'deposits' ? req.amount : -req.amount;
                    transaction.update(accRef, { availableBalance: acc.availableBalance + amount });
                    transaction.set(doc(collection(db, "transactions")), { uid: req.uid, amount: req.amount, type: type.toUpperCase(), direction: amount > 0 ? 'credit' : 'debit', description: `Approved ${type}`, status: "SUCCESSFUL", timestamp: serverTimestamp() });
                    transaction.update(reqRef, { status: 'APPROVED' });
                });
                showToast("Request Approved");
            } catch(e) { console.error(e); }
        };

        window.declinePrompt = async (type, id) => {
            const reason = prompt("Decline Reason:");
            if(!reason) return;
            await updateDoc(doc(db, type, id), { status: 'DECLINED', declineReason: reason });
            showToast("Request Declined");
        };

        window.manageUser = async (uid, name) => {
            const amt = prompt(`Adjust Balance for ${name}:`);
            if(!amt || isNaN(amt)) return;
            const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", uid)));
            await updateDoc(doc(db, "accounts", accQ.docs[0].id), { availableBalance: increment(parseFloat(amt)) });
            await addDoc(collection(db, "transactions"), { uid, amount: Math.abs(amt), direction: amt > 0 ? 'credit' : 'debit', type: 'ADMIN', description: 'Account Correction', status: 'SUCCESSFUL', timestamp: serverTimestamp() });
            showToast("Balance Adjusted");
        };

        document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => loadTab(b.dataset.tab));
        loadTab('users');
    </script>
</body>
</html>
