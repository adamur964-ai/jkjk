<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .tab-btn.active { background: #334155; color: white; border-color: #D4AF37; }
        .tb-table th { padding: 12px; font-size: 10px; font-weight: 900; text-transform: uppercase; color: #94a3b8; text-align: left; border-bottom: 2px solid #334155; }
        .tb-table td { padding: 12px; font-size: 11px; border-bottom: 1px solid #334155; }
        #chat-body::-webkit-scrollbar { width: 4px; }
        #chat-body::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <nav class="bg-[#1e293b] p-6 flex justify-between items-center border-b border-slate-800">
        <h1 class="font-black uppercase tracking-widest text-sm text-[#D4AF37]">Central Control</h1>
        <div class="flex items-center gap-6">
            <span id="admin-email" class="text-[10px] font-bold text-slate-400 uppercase">---</span>
            <button id="logout-btn" class="bg-rose-500/10 text-rose-500 px-4 py-1.5 rounded-full text-[10px] font-black uppercase">Exit</button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto p-6">
        <div class="flex gap-2 mb-8 overflow-x-auto pb-2">
            <button class="tab-btn active px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="users">Users</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="deposits">Deposits</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="withdrawals">Withdrawals</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="transfers">Transfers</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="kyc">KYC</button>
            <button class="tab-btn px-6 py-3 rounded-xl text-[10px] font-black uppercase border border-slate-800" data-tab="supportTickets">Live Chat</button>
        </div>

        <div id="tab-content" class="bg-[#1e293b]/30 rounded-[2rem] border border-slate-800 p-8"></div>
    </div>

    <!-- Chat Modal -->
    <div id="chat-modal" class="hidden fixed inset-0 bg-black/90 z-[200] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="bg-[#1e293b] w-full max-w-lg rounded-[2.5rem] p-8 border border-slate-700 h-[650px] flex flex-col shadow-2xl">
            <div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-4">
                <div>
                    <h3 id="chat-subject" class="font-black uppercase text-sm">Customer Support</h3>
                    <p id="chat-ref" class="text-[9px] text-slate-500 font-bold uppercase"></p>
                </div>
                <button onclick="closeAdminChat()" class="w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="chat-body" class="flex-1 overflow-y-auto space-y-4 mb-6 pr-2"></div>
            <div class="flex gap-2 bg-slate-900 p-2 rounded-2xl">
                <input type="text" id="admin-reply" class="flex-1 bg-transparent border-none focus:ring-0 text-sm px-4" placeholder="Reply to customer...">
                <button id="send-reply-btn" class="bg-[#D4AF37] text-[#002147] px-6 py-3 rounded-xl font-black uppercase text-[10px]">Send</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { auth, db, ADMIN_EMAIL } from './firebase-config.js';
        import { collection, query, onSnapshot, doc, updateDoc, runTransaction, serverTimestamp, getDocs, where, addDoc, arrayUnion, increment } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { formatCurrency } from './utils.js';
        import { showToast } from './toast.js';

        auth.onAuthStateChanged(user => {
            if (!user || user.email !== ADMIN_EMAIL) window.location.href = "login.html";
            document.getElementById('admin-email').innerText = user.email;
        });

        let chatUnsubscribe = null;

        const loadTab = (tab) => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
            onSnapshot(collection(db, tab), async (snap) => {
                const content = document.getElementById('tab-content');
                if (tab === 'users') {
                    const accs = await getDocs(collection(db, "accounts"));
                    const accMap = {}; accs.forEach(a => accMap[a.data().ownerUid] = a.data());
                    content.innerHTML = `
                        <table class="tb-table w-full">
                            <thead><tr><th>User</th><th>Account ID</th><th>Available Balance</th><th>Action</th></tr></thead>
                            <tbody>${snap.docs.map(uDoc => {
                                const u = uDoc.data();
                                const a = accMap[u.uid] || {};
                                return `<tr>
                                    <td>${u.fullName}<br><span class="text-[9px] text-slate-500 uppercase font-bold">${u.email}</span></td>
                                    <td class="font-mono text-slate-400">${a.accountNumber || 'NO ACCOUNT'}</td>
                                    <td class="text-[#D4AF37] font-black">${formatCurrency(a.availableBalance)}</td>
                                    <td>
                                        <button onclick="manageUser('${u.uid}', '${u.fullName}')" class="bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg font-black uppercase text-[9px]">Add/Remove Money</button>
                                    </td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>`;
                } else if (tab === 'supportTickets') {
                    content.innerHTML = `<table class="tb-table w-full"><thead><tr><th>Subject</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${snap.docs.map(tDoc => {
                                const t = tDoc.data();
                                return `<tr><td>${t.subject}</td><td>${t.status}</td><td><button onclick="openAdminChat('${tDoc.id}')" class="text-blue-400 font-black uppercase text-[9px]">Chat</button></td></tr>`;
                            }).join('')}</tbody></table>`;
                } else {
                    content.innerHTML = `
                        <table class="tb-table w-full">
                            <thead><tr><th>ID</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                            <tbody>${snap.docs.map(dDoc => {
                                const d = dDoc.data();
                                return `<tr><td>${dDoc.id.slice(0,6)}</td><td class="font-black">${formatCurrency(d.amount)}</td><td>${d.status}</td>
                                    <td>${d.status === 'PENDING' ? `<button onclick="approveRequest('${tab}', '${dDoc.id}')" class="text-emerald-400 mr-3">Approve</button><button onclick="declinePrompt('${tab}', '${dDoc.id}')" class="text-rose-400">Decline</button>` : 'Processed'}</td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>`;
                }
            });
        };

        // --- NEW: ADD/REMOVE MONEY LOGIC ---
        window.manageUser = async (uid, name) => {
            const amountStr = prompt(`Adjust Balance for ${name}\n\nEnter amount (use '-' to remove, e.g. -500):`);
            if (!amountStr || isNaN(amountStr)) return;

            const reason = prompt("Enter reason for this adjustment (User will see this):", "Admin Adjustment");
            if (!reason) return;

            const amount = parseFloat(amountStr);

            try {
                // 1. Find the account
                const accQ = query(collection(db, "accounts"), where("ownerUid", "==", uid));
                const accSnap = await getDocs(accQ);

                if (accSnap.empty) {
                    alert("No bank account found for this user.");
                    return;
                }

                const accDocId = accSnap.docs[0].id;
                const accRef = doc(db, "accounts", accDocId);

                // 2. Perform atomic update
                await updateDoc(accRef, {
                    availableBalance: increment(amount),
                    totalBalance: increment(amount)
                });

                // 3. Create a transaction record for the user's history
                await addDoc(collection(db, "transactions"), {
                    uid: uid,
                    amount: Math.abs(amount),
                    type: "ADMIN_ADJUSTMENT",
                    direction: amount > 0 ? "credit" : "debit",
                    description: reason,
                    status: "SUCCESSFUL",
                    timestamp: serverTimestamp()
                });

                showToast(`Success: ${amount > 0 ? 'Added' : 'Removed'} ${formatCurrency(Math.abs(amount))}`);
            } catch (err) {
                console.error(err);
                showToast("Error updating balance", "error");
            }
        };

        window.openAdminChat = (id) => {
            const modal = document.getElementById('chat-modal');
            const body = document.getElementById('chat-body');
            document.getElementById('chat-ref').innerText = `Thread: ${id}`;
            modal.classList.remove('hidden');
            chatUnsubscribe = onSnapshot(doc(db, "supportTickets", id), (snap) => {
                const data = snap.data();
                if (!data) return;
                body.innerHTML = data.messages.map(m => `
                    <div class="flex ${m.sender === 'user' ? 'justify-start' : 'justify-end'}">
                        <div class="max-w-[85%] p-4 rounded-2xl ${m.sender === 'user' ? 'bg-slate-800 text-slate-200' : 'bg-blue-600 text-white'}">
                            <p class="text-xs font-bold">${m.text}</p>
                            <p class="text-[8px] mt-2 uppercase opacity-50 font-black">${m.sender}</p>
                        </div>
                    </div>`).join('');
                body.scrollTop = body.scrollHeight;
            });
            document.getElementById('send-reply-btn').onclick = async () => {
                const text = document.getElementById('admin-reply').value;
                if (!text) return;
                await updateDoc(doc(db, "supportTickets", id), {
                    messages: arrayUnion({ sender: "admin", text, timestamp: new Date().toISOString() }),
                    status: "PENDING"
                });
                document.getElementById('admin-reply').value = "";
            };
        };

        window.closeAdminChat = () => { if (chatUnsubscribe) chatUnsubscribe(); document.getElementById('chat-modal').classList.add('hidden'); };

        // Standard Approvals
        window.approveRequest = async (type, id) => {
            try {
                await runTransaction(db, async (transaction) => {
                    const reqRef = doc(db, type, id);
                    const reqSnap = await transaction.get(reqRef);
                    const req = reqSnap.data();
                    const accQ = await getDocs(query(collection(db, "accounts"), where("ownerUid", "==", req.uid)));
                    const accRef = doc(db, "accounts", accQ.docs[0].id);
                    const acc = accQ.docs[0].data();

                    if(type === 'deposits') {
                        transaction.update(accRef, { availableBalance: acc.availableBalance + req.amount, totalBalance: acc.totalBalance + req.amount });
                        transaction.set(doc(collection(db, "transactions")), { uid: req.uid, amount: req.amount, type: 'DEPOSIT', direction: 'credit', description: 'Bank Deposit Approved', status: "SUCCESSFUL", timestamp: serverTimestamp() });
                    } else if(type === 'withdrawals') {
                        transaction.update(accRef, { availableBalance: acc.availableBalance - req.amount, totalBalance: acc.totalBalance - req.amount });
                        transaction.set(doc(collection(db, "transactions")), { uid: req.uid, amount: req.amount, type: 'WITHDRAW', direction: 'debit', description: 'Bank Withdrawal Approved', status: "SUCCESSFUL", timestamp: serverTimestamp() });
                    } else if(type === 'transfers') {
                        const recipQ = await getDocs(query(collection(db, "accounts"), where("accountNumber", "==", req.recipientAcc)));
                        transaction.update(accRef, { availableBalance: acc.availableBalance - req.amount });
                        transaction.update(doc(db, "accounts", recipQ.docs[0].id), { availableBalance: recipQ.docs[0].data().availableBalance + req.amount });
                        transaction.set(doc(collection(db, "transactions")), { uid: req.uid, amount: req.amount, type: 'TRANSFER', direction: 'debit', description: `To ${req.recipientAcc}`, status: "SUCCESSFUL", timestamp: serverTimestamp() });
                        transaction.set(doc(collection(db, "transactions")), { uid: recipQ.docs[0].data().ownerUid, amount: req.amount, type: 'TRANSFER', direction: 'credit', description: `From Admin/Correction`, status: "SUCCESSFUL", timestamp: serverTimestamp() });
                    } else if(type === 'kyc') {
                        transaction.update(doc(db, "users", req.uid), { kycStatus: 'VERIFIED' });
                    }
                    transaction.update(reqRef, { status: 'APPROVED' });
                });
                showToast("Request Approved");
            } catch(e) { console.error(e); }
        };

        window.declinePrompt = async (type, id) => {
            const reason = prompt("Decline Reason:");
            if(!reason) return;
            await updateDoc(doc(db, type, id), { status: 'DECLINED', declineReason: reason });
            showToast("Request Declined");
        };

        document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => loadTab(b.dataset.tab));
        loadTab('users');
    </script>
</body>
</html>
