<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Trust Bank</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .view-section { display: none; }
        .view-section.active { display: block; }
        #messages-container::-webkit-scrollbar { width: 4px; }
        #messages-container::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 pb-32">
    <div id="header-container"></div>

    <main class="max-w-md mx-auto px-6 pt-8">
        
        <!-- Tab 1: Home View -->
        <div id="home-view" class="view-section active space-y-8">
            <div class="space-y-1">
                <p class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">Account Overview</p>
                <h1 id="user-name-display" class="text-2xl font-black text-[#002147]">Loading...</h1>
            </div>

            <!-- Balance Card -->
            <div class="bg-[#002147] rounded-[2.5rem] p-8 text-white relative overflow-hidden shadow-2xl">
                <div class="relative z-10">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <p class="text-[10px] font-black uppercase tracking-[0.2em] text-[#D4AF37]/80 mb-1">Available Balance</p>
                            <h2 id="balance-main" class="text-4xl font-black tracking-tight">$0.00</h2>
                        </div>
                        <div id="currency-badge" class="px-3 py-1 bg-white/10 rounded-lg text-[10px] font-black">USD</div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 border-t border-white/10 pt-6">
                        <div>
                            <p class="text-[9px] font-black uppercase tracking-wider text-slate-400 mb-1">Total Assets</p>
                            <p id="balance-total" class="text-lg font-bold">$0.00</p>
                        </div>
                        <div>
                            <p class="text-[9px] font-black uppercase tracking-wider text-slate-400 mb-1">Savings</p>
                            <p id="balance-savings" class="text-lg font-bold">$0.00</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="grid grid-cols-4 gap-4">
                <a href="deposit.html" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-[#002147] shadow-sm border border-slate-100 hover:scale-105 transition-transform"><i class="fa-solid fa-arrow-down-to-bracket text-xl"></i></div>
                    <span class="text-[10px] font-black uppercase text-slate-500">Deposit</span>
                </a>
                <a href="withdraw.html" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-[#002147] shadow-sm border border-slate-100 hover:scale-105 transition-transform"><i class="fa-solid fa-money-bill-transfer text-xl"></i></div>
                    <span class="text-[10px] font-black uppercase text-slate-500">Withdraw</span>
                </a>
                <a href="transfer.html" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-[#002147] shadow-sm border border-slate-100 hover:scale-105 transition-transform"><i class="fa-solid fa-paper-plane text-xl"></i></div>
                    <span class="text-[10px] font-black uppercase text-slate-500">Transfer</span>
                </a>
                <button onclick="switchTab('support')" class="flex flex-col items-center gap-2">
                    <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center text-[#002147] shadow-sm border border-slate-100 hover:scale-105 transition-transform"><i class="fa-solid fa-headset text-xl"></i></div>
                    <span class="text-[10px] font-black uppercase text-slate-500">Support</span>
                </button>
            </div>

            <!-- Recent Activity -->
            <section>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xs font-black uppercase tracking-[0.2em] text-[#002147]">Recent Activity</h3>
                    <a href="transactions.html" class="text-[10px] font-black uppercase tracking-widest text-[#D4AF37]">View All</a>
                </div>
                <div id="recent-transactions" class="space-y-4"></div>
            </section>
        </div>

        <!-- Tab 2: Support/Chat View -->
        <div id="support-view" class="view-section space-y-6">
            <div id="ticket-list-container">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-black text-[#002147]">Support Center</h2>
                    <button id="new-chat-btn" class="bg-[#002147] text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">New Chat</button>
                </div>
                <div id="ticket-list" class="space-y-3"></div>
            </div>

            <!-- Active Chat Thread -->
            <div id="active-chat-container" class="hidden flex flex-col h-[70vh]">
                <button onclick="hideChat()" class="mb-4 text-slate-400 text-[10px] font-black uppercase"><i class="fa-solid fa-arrow-left mr-1"></i> Back to list</button>
                <div id="messages-container" class="flex-1 overflow-y-auto space-y-4 pr-2"></div>
                <div class="mt-4 flex gap-2 bg-white p-2 rounded-2xl shadow-lg border border-slate-100">
                    <input type="text" id="chat-input" placeholder="Type a message..." class="flex-1 border-none focus:ring-0 bg-transparent text-sm font-bold">
                    <button id="send-msg-btn" class="w-12 h-12 bg-[#002147] text-[#D4AF37] rounded-xl"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

    </main>

    <div id="nav-container"></div>

    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { collection, query, where, orderBy, limit, onSnapshot, doc, updateDoc, arrayUnion, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        import { renderHeader, renderBottomNav, renderEmptyState, renderStatusBadge } from './components.js';
        import { formatCurrency, formatDate } from './utils.js';

        let activeTicketId = null;

        onAuthStateChanged(auth, (user) => {
            if (!user) { window.location.href = "login.html"; return; }

            document.getElementById('header-container').innerHTML = renderHeader(`Trust Bank`);
            document.getElementById('nav-container').innerHTML = renderBottomNav('dashboard');

            // 1. Fetch Profile Name
            onSnapshot(doc(db, "users", user.uid), (snap) => {
                const data = snap.data();
                if(data) document.getElementById('user-name-display').innerText = `Hello, ${data.fullName}`;
            });

            // 2. Account Balances
            onSnapshot(query(collection(db, "accounts"), where("ownerUid", "==", user.uid)), (snap) => {
                if (!snap.empty) {
                    const acc = snap.docs[0].data();
                    document.getElementById('balance-main').innerText = formatCurrency(acc.availableBalance, acc.currency);
                    document.getElementById('balance-total').innerText = formatCurrency(acc.totalBalance, acc.currency);
                    document.getElementById('balance-savings').innerText = formatCurrency(acc.savingsBalance, acc.currency);
                }
            });

            // 3. Merged Transactions
            const collections = ["transactions", "deposits", "withdrawals", "transfers"];
            let combined = [];
            collections.forEach(coll => {
                onSnapshot(query(collection(db, coll), where("uid", "==", user.uid)), (snap) => {
                    combined = combined.filter(item => item._coll !== coll);
                    snap.forEach(d => combined.push({...d.data(), _coll: coll}));
                    renderActivity();
                });
            });

            const renderActivity = () => {
                const cont = document.getElementById('recent-transactions');
                const sorted = combined.sort((a,b) => (b.timestamp?.seconds || b.createdAt?.seconds) - (a.timestamp?.seconds || a.createdAt?.seconds)).slice(0,5);
                cont.innerHTML = sorted.map(t => `
                    <div class="flex items-center justify-between p-4 bg-white rounded-3xl border border-slate-100 shadow-sm">
                        <div>
                            <p class="text-sm font-black text-[#002147]">${t.description || t.type || 'Transaction'}</p>
                            <p class="text-[10px] font-bold text-slate-400">${formatDate(t.timestamp || t.createdAt)}</p>
                        </div>
                        <p class="text-sm font-black ${t.direction === 'credit' ? 'text-emerald-600' : 'text-rose-600'}">${formatCurrency(t.amount)}</p>
                    </div>
                `).join('');
            };

            // 4. Live Chat Logic
            onSnapshot(query(collection(db, "supportTickets"), where("uid", "==", user.uid), orderBy("createdAt", "desc")), snap => {
                const listCont = document.getElementById('ticket-list');
                listCont.innerHTML = snap.docs.map(dDoc => {
                    const t = dDoc.data();
                    return `<div onclick="openChat('${dDoc.id}', '${t.subject}')" class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center cursor-pointer">
                        <p class="font-bold text-sm text-[#002147]">${t.subject}</p>
                        ${renderStatusBadge(t.status)}
                    </div>`;
                }).join('');

                if (activeTicketId) {
                    const ticket = snap.docs.find(d => d.id === activeTicketId)?.data();
                    if (ticket) renderMessages(ticket.messages);
                }
            });

            document.getElementById('send-msg-btn').onclick = async () => {
                const text = document.getElementById('chat-input').value;
                if (!text || !activeTicketId) return;
                await updateDoc(doc(db, "supportTickets", activeTicketId), {
                    messages: arrayUnion({ sender: "user", text, timestamp: new Date().toISOString() }),
                    status: "OPEN"
                });
                document.getElementById('chat-input').value = "";
            };

            document.getElementById('new-chat-btn').onclick = async () => {
                const subj = prompt("Enter subject for new chat:");
                if(!subj) return;
                await addDoc(collection(db, "supportTickets"), {
                    uid: user.uid, subject: subj, status: "OPEN", createdAt: serverTimestamp(),
                    messages: [{ sender: "user", text: `I need help with ${subj}`, timestamp: new Date().toISOString() }]
                });
            };
        });

        window.switchTab = (tab) => {
            document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
            document.getElementById(tab + '-view').classList.add('active');
        };

        window.openChat = (id, subj) => {
            activeTicketId = id;
            document.getElementById('ticket-list-container').classList.add('hidden');
            document.getElementById('active-chat-container').classList.remove('hidden');
        };

        window.hideChat = () => {
            activeTicketId = null;
            document.getElementById('ticket-list-container').classList.remove('hidden');
            document.getElementById('active-chat-container').classList.add('hidden');
        };

        const renderMessages = (messages) => {
            const cont = document.getElementById('messages-container');
            cont.innerHTML = messages.map(m => `
                <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
                    <div class="max-w-[85%] p-3 rounded-2xl ${m.sender === 'user' ? 'bg-[#002147] text-white rounded-tr-none' : 'bg-white border text-slate-700 rounded-tl-none'} shadow-sm">
                        <p class="text-xs font-bold">${m.text}</p>
                    </div>
                </div>
            `).join('');
            cont.scrollTop = cont.scrollHeight;
        };
    </script>
</body>
</html>
