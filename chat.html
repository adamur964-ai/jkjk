<!-- Enhanced Chat Interface Snippet -->
<style>
    .chat-container { height: calc(100vh - 160px); }
    .message-appear { animation: fadeInUp 0.3s ease-out forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .typing-indicator span { animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
</style>

<div class="chat-container flex flex-col bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-slate-100">
    <!-- Header -->
    <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-[#002147] text-white">
        <div class="flex items-center gap-3">
            <div class="relative">
                <img src="assets/support-avatar.png" class="w-10 h-10 rounded-full border-2 border-[#D4AF37]">
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#002147]"></div>
            </div>
            <div>
                <h3 class="font-black text-sm uppercase">Trust Support</h3>
                <p class="text-[9px] font-bold text-emerald-400">ONLINE • AVERAGE RESPONSE 2M</p>
            </div>
        </div>
        <div id="ticket-status-pill" class="px-3 py-1 bg-white/10 rounded-full text-[8px] font-black uppercase tracking-widest">In Progress</div>
    </div>

    <!-- Message Flow -->
    <div id="chat-flow" class="flex-1 overflow-y-auto p-6 space-y-4 bg-slate-50/50">
        <!-- Messages hydrate here -->
    </div>

    <!-- Typing Indicator -->
    <div id="admin-typing" class="hidden px-6 py-2 text-[10px] font-bold text-slate-400 italic">
        Bank Support is typing<span>...</span>
    </div>

    <!-- Input Area -->
    <div class="p-4 bg-white border-t border-slate-100">
        <div id="drop-zone" class="relative flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border-2 border-transparent focus-within:border-[#D4AF37] transition-all">
            <button onclick="document.getElementById('file-input').click()" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:text-[#002147]">
                <i class="fa-solid fa-paperclip"></i>
            </button>
            <input type="file" id="file-input" class="hidden" multiple>
            <input type="text" id="msg-input" placeholder="Type a message or drop files..." class="flex-1 bg-transparent border-none focus:ring-0 font-bold text-sm text-[#002147]">
            <button id="send-btn" class="w-12 h-12 bg-[#002147] text-[#D4AF37] rounded-xl shadow-lg shadow-navy-900/20 active:scale-90 transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </div>
</div>

<script type="module">
    import { auth, db } from './firebase-config.js';
    import { collection, doc, onSnapshot, addDoc, updateDoc, serverTimestamp, query, orderBy } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
    import { formatChatDate } from './utils.js';

    let userUid;
    const msgInput = document.getElementById('msg-input');
    const chatFlow = document.getElementById('chat-flow');
    const notificationSound = new Audio('assets/new-message.mp3');

    auth.onAuthStateChanged(user => {
        if (!user) return;
        userUid = user.uid;
        loadMessages();
        updateTypingStatus();
    });

    function loadMessages() {
        const q = query(collection(db, "supportTickets", userUid, "messages"), orderBy("timestamp", "asc"));
        onSnapshot(q, snap => {
            chatFlow.innerHTML = "";
            let lastDate = "";
            
            snap.docs.forEach(d => {
                const m = d.data();
                const isMe = m.senderId === userUid;
                
                // Date Separator logic
                const dateStr = formatChatDate(m.timestamp);
                if (dateStr !== lastDate) {
                    chatFlow.innerHTML += `<div class="text-center my-4"><span class="text-[9px] font-black uppercase text-slate-400 bg-slate-100 px-3 py-1 rounded-full">${dateStr}</span></div>`;
                    lastDate = dateStr;
                }

                chatFlow.innerHTML += `
                    <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'} message-appear">
                        <div class="max-w-[80%] p-4 rounded-2xl text-sm font-bold shadow-sm ${isMe ? 'bg-[#002147] text-white rounded-tr-none' : 'bg-white border border-slate-200 text-[#002147] rounded-tl-none'}">
                            ${m.fileUrl ? renderFile(m) : m.text}
                            <div class="flex items-center justify-end gap-1 mt-1 opacity-50 text-[8px]">
                                ${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : ''}
                                ${isMe ? renderReadReceipt(m.status) : ''}
                            </div>
                        </div>
                    </div>`;
            });
            chatFlow.scrollTop = chatFlow.scrollHeight;
            if (snap.docChanges().some(c => c.type === "added" && c.doc.data().senderId !== userUid)) {
                notificationSound.play();
            }
        });
    }

    async function sendMessage() {
        const text = msgInput.value.trim();
        if (!text) return;
        msgInput.value = "";
        
        await addDoc(collection(db, "supportTickets", userUid, "messages"), {
            senderId: userUid,
            text: text,
            timestamp: serverTimestamp(),
            status: 'sent' // sent, delivered, read
        });

        // Update Ticket Metadata
        await updateDoc(doc(db, "supportTickets", userUid), {
            lastMessage: text,
            lastActivity: serverTimestamp(),
            unreadAdminCount: increment(1),
            status: 'OPEN'
        });
    }

    // Typing Logic
    let typingTimer;
    msgInput.addEventListener('input', () => {
        updateDoc(doc(db, "supportTickets", userUid), { isTypingUser: true });
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            updateDoc(doc(db, "supportTickets", userUid), { isTypingUser: false });
        }, 2000);
    });
</script>
