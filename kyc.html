<!-- Inside kyc.html body -->
<main class="max-w-md mx-auto px-6 pt-8 pb-20">
    <div id="kyc-container" class="bg-white rounded-[2.5rem] border border-slate-200 shadow-2xl overflow-hidden">
        <!-- Status Header -->
        <div id="kyc-status-header" class="p-8 text-center border-b border-slate-100">
            <div id="status-icon" class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-300">
                <i class="fa-solid fa-id-card text-2xl"></i>
            </div>
            <h2 id="status-title" class="text-xl font-black text-[#002147]">Identity Verification</h2>
            <p id="status-desc" class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-2">Level 1 Security Audit</p>
        </div>

        <!-- KYC Form -->
        <form id="kyc-form" class="p-8 space-y-6">
            <div class="space-y-4">
                <div class="p-4 bg-slate-50 rounded-2xl border border-slate-100">
                    <label class="text-[10px] font-black uppercase text-slate-400 mb-2 block">Document Category</label>
                    <select id="doc-type" class="w-full bg-transparent border-none font-bold text-[#002147] focus:ring-0">
                        <option>International Passport</option>
                        <option>National ID Card</option>
                        <option>Driver's License</option>
                    </select>
                </div>

                <!-- Professional Upload Slots -->
                <div class="grid grid-cols-1 gap-4">
                    <div class="upload-slot relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:border-[#D4AF37] transition-colors">
                        <input type="file" id="kyc-front" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" required>
                        <i class="fa-solid fa-camera text-slate-300 mb-2"></i>
                        <p class="text-[9px] font-black uppercase text-slate-500">ID Front Side</p>
                    </div>
                    <div class="upload-slot relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:border-[#D4AF37] transition-colors">
                        <input type="file" id="kyc-back" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" required>
                        <i class="fa-solid fa-camera text-slate-300 mb-2"></i>
                        <p class="text-[9px] font-black uppercase text-slate-500">ID Back Side</p>
                    </div>
                    <div class="upload-slot relative border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:border-[#D4AF37] transition-colors">
                        <input type="file" id="kyc-selfie" class="absolute inset-0 opacity-0 cursor-pointer" accept="image/*" required>
                        <i class="fa-solid fa-user-check text-slate-300 mb-2"></i>
                        <p class="text-[9px] font-black uppercase text-slate-500">Live Selfie</p>
                    </div>
                </div>
            </div>
            <button type="submit" id="submit-btn" class="w-full btn-primary h-16 shadow-xl shadow-navy-900/20">Submit for Audit</button>
        </form>
    </div>
</main>

<script type="module">
    // ... imports ...
    auth.onAuthStateChanged(user => {
        if (!user) return;
        // Real-time listener for KYC status
        onSnapshot(doc(db, "users", user.uid), (snap) => {
            const data = snap.data();
            const status = data.kycStatus || 'NONE';
            updateUI(status, data.kycReason);
        });
    });

    function updateUI(status, reason) {
        const form = document.getElementById('kyc-form');
        const header = document.getElementById('kyc-status-header');
        const icon = document.getElementById('status-icon');
        
        if (status === 'PENDING') {
            form.innerHTML = `<div class="p-10 text-center"><i class="fa-solid fa-clock-rotate-left text-4xl text-amber-500 mb-4 animate-pulse"></i><p class="text-sm font-bold text-[#002147]">Documents under review.</p><p class="text-[10px] text-slate-400 mt-2 uppercase">Estimate: 2-4 Hours</p></div>`;
        } else if (status === 'VERIFIED') {
            header.className = "p-8 text-center border-b border-emerald-50 bg-emerald-50/30";
            icon.className = "w-16 h-16 bg-emerald-500 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white";
            icon.innerHTML = `<i class="fa-solid fa-shield-check text-2xl"></i>`;
            form.innerHTML = `<div class="p-10 text-center"><h3 class="text-emerald-600 font-black uppercase text-xs">Identity Verified</h3><p class="text-[10px] text-slate-400 mt-2">All premium features are now unlocked.</p></div>`;
        }
    }
</script>
