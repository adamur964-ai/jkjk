<!-- Update support.html styles -->
<style>
    #messages-container { background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-attachment: fixed; }
    .bubble { max-width: 80%; padding: 12px 16px; border-radius: 20px; font-size: 14px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .bubble-user { align-self: flex-end; background: #002147; color: white; border-bottom-right-radius: 4px; }
    .bubble-admin { align-self: flex-start; background: white; color: #1e293b; border-bottom-left-radius: 4px; border: 1px solid #e2e8f0; }
    .msg-time { font-size: 9px; opacity: 0.6; margin-top: 5px; display: block; }
</style>

<!-- Update script logic -->
<script type="module">
    // Inside onAuthStateChanged logic...
    window.openTicket = (id, subj) => {
        activeTicketId = id;
        // ... (UI visibility toggles)
        
        // Mark as read for user
        updateDoc(doc(db, "supportTickets", id), { unreadUserCount: 0 });

        onSnapshot(query(collection(db, "supportTickets", id, "messages"), orderBy("timestamp", "asc")), snap => {
            const cont = document.getElementById('messages-container');
            cont.innerHTML = snap.docs.map(d => {
                const m = d.data();
                const isUser = m.senderRole === 'user';
                return `
                    <div class="flex flex-col ${isUser ? 'items-end' : 'items-start'}">
                        <div class="bubble ${isUser ? 'bubble-user' : 'bubble-admin'}">
                            ${m.text}
                            <span class="msg-time ${isUser ? 'text-right' : 'text-left'}">
                                ${m.timestamp ? new Date(m.timestamp.toDate()).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '...'}
                            </span>
                        </div>
                    </div>`;
            }).join('');
            cont.scrollTop = cont.scrollHeight;
        });
    };

    document.getElementById('send-msg-btn').onclick = async () => {
        const text = document.getElementById('chat-input').value;
        if (!text || !activeTicketId) return;
        document.getElementById('chat-input').value = "";

        await addDoc(collection(db, "supportTickets", activeTicketId, "messages"), {
            text, senderRole: "user", timestamp: serverTimestamp()
        });

        await updateDoc(doc(db, "supportTickets", activeTicketId), {
            lastMessage: text,
            lastTimestamp: serverTimestamp(),
            unreadAdminCount: increment(1)
        });
    };
</script>
